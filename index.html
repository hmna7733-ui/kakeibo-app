async function runAiAnalysis(ym, summary, cardRows){
  const bodyEl = document.getElementById('ai-analysis-body');
  if (!bodyEl) return;

  if (summary.totalSpend === 0 && summary.savings === 0) {
    bodyEl.innerHTML = '<div class="ai-point"><span class="ai-icon good">i</span><span>この月の記帳がまだありません。記帳が進むと分析が表示されます。</span></div>';
    return;
  }

  const catLines = Object.entries(summary.byCategory)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10)
    .map(([k,v]) => `${k}: ${v}円 (予算${(AppState.categories.find(c=>c.name===k)||{}).budget||0}円)`)
    .join('\n');

  const cardLines = cardRows.map(c => `${c.name}: 利用${c.usage}円 / 請求${c.billed!==null?c.billed+'円':'未確定'}`).join('\n');

  const prompt = `あなたは家計簿アプリのファイナンシャルアドバイザーです。以下の${monthLabel(ym)}の家計データを分析し、良い点1つと改善点・注意点を2つ、日本語で簡潔に（各60字程度）述べてください。

【収支】収入${summary.income}円 / 支出${summary.expense}円 / 貯蓄${summary.savings}円 / 返済${summary.repayment}円 / 予算合計${summary.budgetTotal}円

【項目別支出（上位）】
${catLines}

【カード利用と請求の差分】
${cardLines || 'データなし'}

以下のJSON形式のみで回答してください（説明文や前置きは不要）:
{"good":"良い点の文章","bad1":"注意点1の文章","bad2":"注意点2の文章"}`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 600,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await response.json();
    const text = data.content.map(b => b.text || '').join('');
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    bodyEl.innerHTML = `
      <div class="ai-point"><span class="ai-icon good">✓</span><span>${escapeHtml(parsed.good||'')}</span></div>
      <div class="ai-point"><span class="ai-icon bad">!</span><span>${escapeHtml(parsed.bad1||'')}</span></div>
      <div class="ai-point"><span class="ai-icon bad">!</span><span>${escapeHtml(parsed.bad2||'')}</span></div>
    `;
  } catch(e) {
    console.warn('AI analysis error:', e);
    bodyEl.innerHTML = '<div class="ai-point"><span class="ai-icon bad">!</span><span>分析の取得に失敗しました。しばらくしてから分析タブを開き直してください。</span></div>';
  }
}

function renderCardsUsageTab(){
  const ym = AppState.currentMonth;
  const cards = AppState.paymentMethods.filter(m => m.isCard);
  const el = document.getElementById('cards-subtab-content');

  if (cards.length === 0) {
    el.innerHTML = '<div class="card category-list"><div class="empty-hint">カードが登録されていません。設定から追加してください。</div></div>';
    return;
  }

  const rows = cards.map(card => {
    const usage = getCardUsageForMonth(ym, card.name);
    const range = getCardStatementRange(card, ym);
    const txCount = AppState.transactions.filter(t => t.method === card.name && !t.isIncome && t.date >= range.startDate && t.date <= range.endDate).length;

  const el = document.getElementById('cards-subtab-content');

  if (cards.length === 0) {

    return;
  }

  let html = `

    </div>`;
  html += '<div style="display:flex;flex-direction:column;gap:12px">';

  cards.forEach(card => {

    const txCount = getTransactionsForMonth(billingTargetYm).filter(t => t.method === card.name).length;

    html += `
      <div class="card" style="padding:18px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="width:34px;height:22px;border-radius:5px;background:${card.color||'var(--terracotta)'}"></div>
            <div>
              <div style="font-size:16.5px;font-weight:700;cursor:pointer;color:var(--terracotta);text-decoration:underline dotted" onclick="openCardHistoryModal('${escapeJs(card.name)}','${billingTargetYm}')">${escapeHtml(card.name)} ›</div>
              <div style="font-size:13px;color:var(--gray-muted)">${offsetLabel}請求 → ${monthLabel(billingTargetYm)}の利用分 ${txCount}件</div>
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-size:16px;font-weight:700">${fmtYen(usage)}</div>
            <div style="font-size:13px;color:var(--gray-muted)">利用累計</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:14px">
          <div style="flex:1">
            <label style="font-size:16px;color:var(--gray-muted);display:block;margin-bottom:6px">請求額（一括入力）</label>
            <input type="number" inputmode="numeric" id="card-bill-${cssEscape(card.name)}" value="${billed!==null?billed:''}" placeholder="未入力"
              style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--cream)">
          </div>
          <button class="submit-btn" style="width:auto;padding:11px 16px;margin-top:18px;font-size:16px"
            onclick="saveCardBilling('${escapeJs(card.name)}', '${billingTargetYm}')">保存</button>
        </div>
        ${diff !== null ? `
          <div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:${ok?'var(--sage-soft)':'rgba(181,72,58,0.1)'};font-size:16.5px;font-weight:700;color:${ok?'var(--sage-deep)':'var(--red-deficit)'};text-align:center">
            ${ok ? '記帳と請求額が一致しています ✓' : `差額 ${fmtYenSigned(diff)} （${diff>0?'記帳より請求が多い＝記帳漏れの可能性':'記帳より請求が少ない＝記帳の重複・誤入力の可能性'}）`}
          </div>` : ''}
      </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function cssEscape(s){ return String(s).replace(/[^a-zA-Z0-9]/g, c => 'u'+c.charCodeAt(0)); }
function escapeJs(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function saveCardBilling(cardName, targetYm){
  const input = document.getElementById('card-bill-' + cssEscape(cardName));
  const val = parseFloat(input.value);
  if (isNaN(val) || val < 0) {
    showToast('正しい金額を入力してください');
    return;
  }
  setCardBillingForMonth(targetYm || AppState.currentMonth, cardName, val);
  showToast('請求額を保存しました');
  renderCardsBillingTab();
}

/* ============================================================
   設定リストのドラッグ並び替え（汎用・ポインターイベント方式）
   containerEl内の「.settings-row[data-idx]」を、各行の「.drag-handle」を
   つまんで上下にドラッグすると入れ替えられる。ドロップ時にDOM順から
   新しいdata-idx配列を読み取ってonReorderへ渡す。
   ============================================================ */
function enableDragReorder(containerEl, onReorder){
  if (!containerEl) return;
  containerEl.querySelectorAll('.drag-handle').forEach(handle => {
    handle.addEventListener('pointerdown', (e) => {
      const row = handle.closest('.settings-row');
      if (!row) return;
      e.preventDefault();

      const rows = () => Array.from(containerEl.querySelectorAll('.settings-row'));
      let startY = e.clientY;
      row.classList.add('dragging-row');
      row.style.position = 'relative';
      row.style.zIndex = '20';
      row.setPointerCapture(e.pointerId);

      const onMove = (ev) => {
        const dy = ev.clientY - startY;
        row.style.transform = `translateY(${dy}px)`;

        const rowRect = row.getBoundingClientRect();
        const rowCenter = rowRect.top + rowRect.height / 2;

        for (const other of rows()) {
          if (other === row) continue;
          const rect = other.getBoundingClientRect();
          const otherCenter = rect.top + rect.height / 2;
          const rowIsAfterInDom = row.compareDocumentPosition(other) & Node.DOCUMENT_POSITION_PRECEDING;
          if (!rowIsAfterInDom && rowCenter > otherCenter) {
            // rowがDOM上で前にあり、下に十分動いた→otherの後ろへ移動
            containerEl.insertBefore(row, other.nextSibling);
            startY += rect.height;
            break;
          } else if (rowIsAfterInDom && rowCenter < otherCenter) {
            // rowがDOM上で後にあり、上に十分動いた→otherの前へ移動
            containerEl.insertBefore(row, other);
            startY -= rect.height;
            break;
          }
        }
      };

      const onUp = (ev) => {
        row.releasePointerCapture(ev.pointerId);
        row.removeEventListener('pointermove', onMove);
        row.removeEventListener('pointerup', onUp);
        row.removeEventListener('pointercancel', onUp);
        row.classList.remove('dragging-row');
        row.style.position = '';
        row.style.zIndex = '';
        row.style.transform = '';
        const newOrder = rows().map(r => parseInt(r.dataset.idx, 10));
        onReorder(newOrder);
      };

      row.addEventListener('pointermove', onMove);
      row.addEventListener('pointerup', onUp);
      row.addEventListener('pointercancel', onUp);
    });
  });
}

function initCategoryDragSort(){
  document.querySelectorAll('.cat-drag-group').forEach(container => {
    enableDragReorder(container, (newOrderRealIdx) => {
      // このグループの行のAppState.categories上の実インデックス配列(表示順)から、
      // 新しい順序で並び替えた要素配列を作り、元の位置にそのまま差し替える
      const groupObjs = newOrderRealIdx.map(i => AppState.categories[i]);
      const positions = newOrderRealIdx.slice().sort((a,b)=>a-b);
      positions.forEach((pos, i) => { AppState.categories[pos] = groupObjs[i]; });
      saveLocalState();
      renderSettingsTabContent();
    });
  });
}

// 項目・予算ページ上部の合計カードを、画面全体を再描画せずその場で更新する
// （入力中のフォーカスを失わせないため）
function refreshCategoryBudgetSummary(){
  const incomeEl = document.getElementById('cat-budget-total-収入');
  const expenseEl = document.getElementById('cat-budget-total-支出');
  const savingsEl = document.getElementById('cat-budget-total-貯金');
  const repayEl = document.getElementById('cat-budget-total-返済');
  const outflowEl = document.getElementById('cat-budget-total-outflow');
  const diffEl = document.getElementById('cat-budget-diff');
  if (!incomeEl && !expenseEl && !savingsEl && !repayEl) return; // このタブが表示されていない

  const incomeTotal = AppState.incomeSources.reduce((a,s)=>a+(s.budget||0),0);
  const expenseTotal = AppState.categories.filter(c=>['変動費','固定費'].includes(c.group)).reduce((a,c)=>a+(c.budget||0),0);
  const savingsTotal = AppState.categories.filter(c=>c.group==='貯蓄').reduce((a,c)=>a+(c.budget||0),0);
  const repayTotal = AppState.categories.filter(c=>c.group==='返済').reduce((a,c)=>a+(c.budget||0),0);
  const outflowTotal = expenseTotal + savingsTotal + repayTotal;
  const diff = incomeTotal - outflowTotal;

  if (incomeEl) incomeEl.textContent = fmtYen(incomeTotal);
  if (expenseEl) expenseEl.textContent = fmtYen(expenseTotal);
  if (savingsEl) savingsEl.textContent = fmtYen(savingsTotal);
  if (repayEl) repayEl.textContent = fmtYen(repayTotal);
  if (outflowEl) outflowEl.textContent = fmtYen(outflowTotal);
  if (diffEl) {
    diffEl.textContent = fmtYenSigned(diff);
    diffEl.style.color = diff >= 0 ? 'var(--sage-deep)' : 'var(--red-deficit)';
  }
}

function getIncomeHistoryForMonth(ym, name){
  const stored = stor('kk_income_history') || {};
  return (stored[ym] && stored[ym][name]) ? stored[ym][name] : [];
}

// 設定›収入の「入力」ボタン：記帳データ（収入ジャンル）へ直接追加する
function addIncomeTransactionFromSettings(ym, name, inputIdx){
  const input = document.getElementById(`income-amt-${inputIdx}`);
  const amount = parseFloat(input ? input.value : NaN);
  if (isNaN(amount) || amount <= 0) { showToast('正しい金額を入力してください'); return; }

  const actual = getIncomeActualForMonth(ym);
  const entry = actual[name] || {};
  const day = (typeof entry === 'object' && entry.day) ? entry.day : new Date().getDate();
  const [y, m] = ym.split('-');
  const daysInMonth = new Date(parseInt(y,10), parseInt(m,10), 0).getDate();
  const safeDay = Math.min(Math.max(1, day), daysInMonth);

  AppState.transactions.push({
    id: nextTxId(),
    date: `${y}-${pad2(parseInt(m,10))}-${pad2(safeDay)}`,
    amount, category: name, method: '収入', memo: '',
    genre: '収入', isIncome: true,
    createdAt: Date.now(),
  });
  saveLocalState();
  showToast(`${name} ${fmtYen(amount)} を記帳しました`);
  renderSettingsTabContent();
}

function deleteIncomeTransaction(txId){
  const tx = AppState.transactions.find(t => t.id === txId);
  if (!tx) return;
  showConfirm(`「${tx.category} ${fmtYen(tx.amount)}」を削除しますか？`, () => {
    AppState.transactions = AppState.transactions.filter(t => t.id !== txId);
    saveLocalState();
    showToast('削除しました');
    renderSettingsTabContent();
  }, '削除する');
}

  const values = Array.from({length: daysInMonth}, (_, i) => String(i+1));

}


function updateIncomeActualAmount(ym, name, value){
  const stored = stor('kk_income_actual') || {};
  if (!stored[ym]) stored[ym] = {};
  const existing = stored[ym][name] || {};
  const prev = typeof existing === 'object' ? existing : {amount: existing, day: null};
  stored[ym][name] = {...prev, amount: parseFloat(value)||0};
  stor('kk_income_actual', stored);
  if (currentUser) saveToFirestore();
}

/* 年月日3列ドラム（口座保存用） */
let _drum3Scrolls = [];
let _drum3AccIdx = null;
let _drum3Value = null;

function openDateDrum3(accIdx, value){
  _drum3AccIdx = accIdx;
  _drum3Value = value;

  const now = new Date();
  const curY = now.getFullYear();
  const curM = now.getMonth()+1;
  const curD = now.getDate();

  let existing = document.getElementById('drum3-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'drum-overlay show';
  overlay.id = 'drum3-overlay';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

  const ITEM_H = 44;
  const PAD = 2;

  const years  = Array.from({length:10}, (_,i) => String(curY - 5 + i));
  const months = Array.from({length:12}, (_,i) => String(i+1));
  const days   = Array.from({length:31}, (_,i) => String(i+1));

  const cols = [
    {label:'年', values: years,  cur: String(curY),  fmt: v => v+'年'},
    {label:'月', values: months, cur: String(curM),  fmt: v => v+'月'},
    {label:'日', values: days,   cur: String(curD),  fmt: v => v+'日'},
  ];

  overlay.innerHTML = `
    <div class="drum-sheet">
      <div class="drum-toolbar">
        <button class="drum-cancel" onclick="document.getElementById('drum3-overlay').remove()">キャンセル</button>
        <span class="drum-title">保存日を選択</span>
        <button class="drum-done" onclick="closeDrum3()">決定</button>
      </div>
      <div class="drum-body" id="drum3-body"></div>
    </div>`;
  document.body.appendChild(overlay);

  _drum3Scrolls = [];
  const body = document.getElementById('drum3-body');

  cols.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = 'drum-col';
    colEl.style.position = 'relative';

    const lbl = document.createElement('div');
    lbl.className = 'drum-col-label';
    lbl.textContent = col.label;

    const scroll = document.createElement('div');
    scroll.className = 'drum-scroll';

    for (let p=0; p<PAD; p++) {
      const pad = document.createElement('div');
      pad.className = 'drum-item'; scroll.appendChild(pad);
    }
    col.values.forEach(v => {
      const item = document.createElement('div');
      item.className = 'drum-item';
      item.textContent = col.fmt(v);
      scroll.appendChild(item);
    });
    for (let p=0; p<PAD; p++) {
      const pad = document.createElement('div');
      pad.className = 'drum-item'; scroll.appendChild(pad);
    }

    const hl = document.createElement('div');
    hl.className = 'drum-highlight';

    colEl.appendChild(lbl); colEl.appendChild(scroll); colEl.appendChild(hl);
    body.appendChild(colEl);

    const curIdx = Math.max(0, col.values.indexOf(col.cur));
    requestAnimationFrame(() => {
      scroll.scrollTop = curIdx * ITEM_H;
      updateDrumHighlight(scroll);
    });
    scroll.addEventListener('scroll', () => updateDrumHighlight(scroll), {passive:true});
    _drum3Scrolls.push({scroll, values: col.values});
  });
}

function closeDrum3(){
  const ITEM_H = 44;
  const picks = _drum3Scrolls.map(({scroll, values}) => {
    const idx = Math.max(0, Math.min(values.length-1, Math.round(scroll.scrollTop / ITEM_H)));
    return values[idx];
  });
  const [y, m, d] = picks;
  const savedAt = new Date(parseInt(y), parseInt(m)-1, parseInt(d), 12, 0, 0).getTime();

  const overlay = document.getElementById('drum3-overlay');
  if (overlay) overlay.remove();
  _drum3Scrolls = [];

  const acc = AppState.accounts[_drum3AccIdx];
  if (!acc) return;
  acc.balance = _drum3Value;
  if (!acc.balanceHistory) acc.balanceHistory = [];
  acc.balanceHistory.push({ value: _drum3Value, savedAt });
  saveLocalState();
  showToast(`${y}/${m}/${d} の残高を保存しました`);
  renderSettingsTabContent();
  _drum3AccIdx = null;
  _drum3Value = null;
}

async function manualReload(){
  const btn = document.getElementById('reload-btn');
  if (btn) { btn.classList.add('spin'); }
  // 保留中のタイマーをキャンセルして即時Firestore保存
  clearTimeout(_saveToFirestoreTimer);
  if (currentUser) {
    try { await saveToFirestore(); } catch(e) { console.warn('Reload save error:', e); }
  }
  setTimeout(() => location.reload(), 300);
}

function registerSW(){
  if (!('serviceWorker' in navigator)) return;
  // インラインSWをBlobで登録（外部ファイル不要）
  const swCode = `
const CACHE = 'kakeibo-v' + Date.now();
self.addEventListener('install', e => { self.skipWaiting(); });
self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
self.addEventListener('message', e => { if (e.data && e.data.type === 'SKIP_WAITING') self.skipWaiting(); });
self.addEventListener('fetch', e => {
  if (e.request.method !== 'GET') return;
  e.respondWith(
    fetch(e.request).then(res => {
      if (res && res.status === 200) {
        const clone = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
      }
      return res;
    }).catch(() => caches.match(e.request))
  );
});`;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).then(reg => {
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          showToast('アップデートがあります。タップして更新 ↺', () => manualReload());
        }
      });
    });
  }).catch(()=>{});
}

/* ============================================================
   Firebase Auth & Sync（golf_tracker / 鬼速PDCAと同じ実装）
   ============================================================ */
function initFirebase(){
  try {
    firebaseApp = firebase.initializeApp(firebaseConfig, 'kakeibo-app');
    auth = firebaseApp.auth();
    db_fs = firebaseApp.firestore();

    // オフラインキャッシュを有効化。これにより、再ログイン時に前回取得した
    // データがネットワーク往復を待たずにすぐ表示され（その後サーバーの最新
    // 内容で自動的に更新される）、体感的な読み込み速度が大きく改善する。
    // 複数タブを開いていても動くようsynchronizeTabsを有効にする。
    // 対応していないブラウザ（プライベートブラウジング等）では静かに無視する。
    try {
      db_fs.enablePersistence({ synchronizeTabs: true }).catch(err => {
        console.warn('Firestore persistence not enabled:', err.code);
      });
    } catch(persistErr) {
      console.warn('Firestore persistence setup error:', persistErr);
    }

    auth.onAuthStateChanged(user => {
      if (skipLoginMode) return;
      // アカウントが切り替わる瞬間、直前のアカウント宛てに予約されていた
      // 保留中のFirestore書き込みタイマーを必ず破棄する。
      // これを消さないと、ログアウト／別アカウントへのログイン直後に
      // 古いタイマーが発火して、切り替わった先のアカウントへ古いデータを
      // 誤って書き込んでしまうことがあった（データ消失の原因）。
      clearTimeout(_saveToFirestoreTimer);
      if (user) {
        currentUser = user;
        document.getElementById('login-screen').classList.remove('show');
        updateSyncBadge('synced', user.email.split('@')[0]);
        startRealtimeSync();
      } else {
        stopRealtimeSync();
        currentUser = null;
        showLoginScreen();
        updateSyncBadge('offline', '未連携');
      }
      document.getElementById('app-loading').style.display = 'none';
    });
  } catch(e) {
    console.error('Firebase init error:', e);
    document.getElementById('app-loading').style.display = 'none';
  }
}

function skipLogin(){
  skipLoginMode = true;
  document.getElementById('login-screen').classList.remove('show');

function submitAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('auth-submit-btn');

  if (!email || !password) {
    errEl.style.display = ''; errEl.textContent = 'メールアドレスとパスワードを入力してください';
    return;
  }
  if (password.length < 6) {
    errEl.style.display = ''; errEl.textContent = 'パスワードは6文字以上にしてください';
    return;
  }
  btn.textContent = '処理中...'; btn.disabled = true;
  errEl.style.display = 'none';

  const action = authMode === 'signup'
    ? auth.createUserWithEmailAndPassword(email, password)
    : auth.signInWithEmailAndPassword(email, password);

  action.catch(err => {
    const msgs = {
      'auth/user-not-found': 'このメールアドレスは登録されていません',
      'auth/wrong-password': 'パスワードが間違っています',
      'auth/email-already-in-use': 'このメールアドレスは既に登録済みです',
      'auth/invalid-email': 'メールアドレスの形式が正しくありません',
      'auth/weak-password': 'パスワードが弱すぎます（6文字以上）',
      'auth/invalid-credential': 'メールアドレスまたはパスワードが間違っています',
    };
    errEl.style.display = ''; errEl.textContent = msgs[err.code] || ('エラー: ' + err.code);
    btn.textContent = authMode === 'signup' ? '新規登録' : 'ログイン'; btn.disabled = false;
  });
}

async function saveToFirestore(ts){
  if (!currentUser || !db_fs) return;
  const updatedAt = ts || Date.now();
  const uid = currentUser.uid;
  const docRef = db_fs.collection('users').doc(uid).collection('kakeibo_app').doc('data');
  try {
    // 上書きする前に、今クラウドにある内容を「ひとつ前の状態」として退避しておく
    // （誤って空のデータや古いデータで上書きしてしまった時の保険）
    try {
      const prevSnap = await docRef.get();
      if (prevSnap.exists) {
        await db_fs.collection('users').doc(uid).collection('kakeibo_app').doc('data_backup_prev').set(prevSnap.data());
      }
    } catch(backupErr) {
      console.warn('Backup snapshot error:', backupErr);
    }

    await docRef.set({
      kk_categories: AppState.categories,
      kk_income_sources: AppState.incomeSources,
      kk_payment_methods: AppState.paymentMethods,
      kk_accounts: AppState.accounts,
      kk_transactions: AppState.transactions,
      kk_card_billings: AppState.cardBillings,
      kk_income_actual: stor('kk_income_actual') || {},
      kk_monthly_budgets: stor('kk_monthly_budgets') || {},
      kk_envelope_reset_ym: stor('kk_envelope_reset_ym') || null,
      kk_savings_first: stor('kk_savings_first') || {},
      kk_income_history: stor('kk_income_history') || {},
      updatedAt
    });
    // このタイムスタンプまでは同期済み。以降の編集だけが「未同期」として扱われる
    stor('kk_last_sync_' + uid, updatedAt);
    stor('kk_pending_change_' + uid, null);
  } catch(e) { console.warn('Firestore save error:', e); }
}

/* ============================================================
   新規ユーザー向け空のデフォルトデータ
   （共有相手が新規登録した際に、既存アカウントの設定・履歴が
   一切引き継がれないよう、すべて空の状態から始める）
   ============================================================ */
const NEW_USER_DEFAULT_CATEGORIES = [];
const NEW_USER_DEFAULT_INCOME_SOURCES = [];
const NEW_USER_DEFAULT_PAYMENT_METHODS = [];
const NEW_USER_DEFAULT_ACCOUNTS = [];

function initNewUser(){
  // 新規ユーザーはデフォルトデータ（空・最小限）で開始
  AppState.categories = JSON.parse(JSON.stringify(NEW_USER_DEFAULT_CATEGORIES));
  AppState.incomeSources = JSON.parse(JSON.stringify(NEW_USER_DEFAULT_INCOME_SOURCES));
  AppState.paymentMethods = JSON.parse(JSON.stringify(NEW_USER_DEFAULT_PAYMENT_METHODS));
  AppState.accounts = JSON.parse(JSON.stringify(NEW_USER_DEFAULT_ACCOUNTS));
  AppState.transactions = [];
  AppState.cardBillings = {};
  // ストレージもクリア
  stor('kk_categories', AppState.categories);
  stor('kk_income_sources', AppState.incomeSources);
  stor('kk_payment_methods', AppState.paymentMethods);
  stor('kk_accounts', AppState.accounts);
  stor('kk_transactions', AppState.transactions);
  stor('kk_card_billings', AppState.cardBillings);
  // 履歴系もクリア
  stor('kk_income_actual', {});
  stor('kk_income_history', {});
  stor('kk_monthly_budgets', {});
  stor('kk_savings_first', {});
  stor('kk_envelope_reset_ym', null);
}

let _firestoreUnsubscribe = null;
let _initialSyncComplete = false; // 今回のログインでクラウドとの最初のすり合わせが終わったか
let _pendingSaveDuringSync = false; // 同期完了前に編集があった場合に立てるフラグ

// リアルタイム同期を開始（onSnapshotでクラウド側の変更を即座に受け取る）
function startRealtimeSync(){
  if (!currentUser || !db_fs) return;
  stopRealtimeSync(); // 念のため既存のリスナーを解除してから張り直す
  _initialSyncComplete = false;
  _pendingSaveDuringSync = false;
  const uid = currentUser.uid;
  updateSyncBadge('syncing', '同期中');

  _firestoreUnsubscribe = db_fs.collection('users').doc(uid)
    .collection('kakeibo_app').doc('data')
    .onSnapshot(
      snap => handleFirestoreSnapshot(snap, uid),
      err => {
        console.warn('Firestore snapshot error:', err);
        updateSyncBadge('synced', currentUser.email.split('@')[0]);
      }
    );
}

function stopRealtimeSync(){
  if (_firestoreUnsubscribe) {
    _firestoreUnsubscribe();
    _firestoreUnsubscribe = null;
  }
  _initialSyncComplete = false;
  _pendingSaveDuringSync = false;
}

// 最初の同期が完了した後の共通処理：保留していた保存があれば送信する
function markInitialSyncComplete(){
  _initialSyncComplete = true;
  if (_pendingSaveDuringSync) {
    _pendingSaveDuringSync = false;
    clearTimeout(_saveToFirestoreTimer);
    _saveToFirestoreTimer = setTimeout(() => saveToFirestore(), 1500);
  }
}

async function handleFirestoreSnapshot(snap, uid){
  if (!currentUser) return;
  try {
    // 自分のこの端末が今まさに書き込んだ内容がサーバー確定前に返ってきただけの場合はスキップ
    // （二重処理や不要な再描画を避ける）
    if (snap.metadata.hasPendingWrites) return;

    if (!snap.exists) {
      // 新規ユーザー：空のデフォルトデータで初期化してFirestoreに保存
      initNewUser();
      const now = Date.now();
      await saveToFirestore(now);
      markInitialSyncComplete();
      showToast('ようこそ！設定から項目や支払い方法を追加してください');
      refreshActivePage();
      updateSyncBadge('synced', currentUser.email.split('@')[0]);
      return;
    }

    const d = snap.data();
    const cloudUpdatedAt = d.updatedAt || 0;
    const lastSync = stor('kk_last_sync_' + uid);       // このデバイスでこのアカウントを最後に同期した時刻（未同期なら null）
    const pendingChange = stor('kk_pending_change_' + uid); // 直近の同期後にこのデバイスで行われた編集の時刻（無ければ null）
    const isFirstLoad = lastSync === null;

    // すでに反映済みの内容なら何もしない（自分自身の確定書き込みのエコーなど）
    if (!isFirstLoad && cloudUpdatedAt <= lastSync) {
      markInitialSyncComplete();
      updateSyncBadge('synced', currentUser.email.split('@')[0]);
      return;
    }

    // このデバイスでこのアカウントを一度も同期したことが無い場合は、
    // ローカルに残っている他アカウント／ゲスト時代のデータを絶対に優先せず、必ずクラウドを信頼する。
    // 同期済みの場合は「前回の同期以降にこのデバイスで編集したか」だけで新旧を比較する
    // （端末間で編集がすれ違っても、実際に手を動かした側のデータを優先できる）。
    const localHasNewerUnsyncedEdit = !isFirstLoad && pendingChange !== null &&
      pendingChange > lastSync && pendingChange >= cloudUpdatedAt;

    if (isFirstLoad || !localHasNewerUnsyncedEdit) {
      applyCloudSnapshot(d, cloudUpdatedAt, uid);
      showToast(isFirstLoad ? 'クラウドからデータを取得しました' : '他の端末での更新を反映しました');
      refreshActivePage();
    } else {
      // このデバイスでの編集の方が新しい（オフライン編集など）→ クラウドへ反映
      await saveToFirestore(pendingChange);
      showToast('クラウドにデータを保存しました');
    }
    markInitialSyncComplete();
    updateSyncBadge('synced', currentUser.email.split('@')[0]);
  } catch(e) {
    console.warn('Firestore snapshot handling error:', e);
    updateSyncBadge('synced', currentUser.email.split('@')[0]);
  }
}

// クラウドのデータをローカルへ反映する（初回ロード・他端末からの更新受信の両方で共用）
function applyCloudSnapshot(d, cloudUpdatedAt, uid){
  AppState.categories = d.kk_categories || AppState.categories;
  AppState.incomeSources = d.kk_income_sources || AppState.incomeSources;
  AppState.paymentMethods = d.kk_payment_methods || AppState.paymentMethods;
  AppState.accounts = d.kk_accounts || AppState.accounts;
  AppState.transactions = d.kk_transactions || [];
  AppState.cardBillings = d.kk_card_billings || AppState.cardBillings;
  if (d.kk_income_actual) stor('kk_income_actual', d.kk_income_actual);
  if (d.kk_monthly_budgets) stor('kk_monthly_budgets', d.kk_monthly_budgets);
  if (d.kk_envelope_reset_ym) stor('kk_envelope_reset_ym', d.kk_envelope_reset_ym);
  if (d.kk_savings_first) stor('kk_savings_first', d.kk_savings_first);
  if (d.kk_income_history) stor('kk_income_history', d.kk_income_history);

  // クラウドの収入履歴（旧方式）が未統合なら、ここでも記帳データへ取り込む
  migrateIncomeHistoryToTransactions();
  // クラウド側のデータにもジャンル未設定の記帳があれば、ここで確定させる
  backfillTransactionGenres();
  // クラウド側のカードにも旧「締め日」設定が残っていれば変換
  migrateCardClosingDayToRange();

  stor('kk_categories', AppState.categories);
  stor('kk_income_sources', AppState.incomeSources);
  stor('kk_payment_methods', AppState.paymentMethods);
  stor('kk_accounts', AppState.accounts);
  stor('kk_transactions', AppState.transactions);
  stor('kk_card_billings', AppState.cardBillings);
  stor('kk_last_sync_' + uid, cloudUpdatedAt || Date.now());
  stor('kk_pending_change_' + uid, null);
}

function updateSyncBadge(state, label){
  const badge = document.getElementById('sync-badge');
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  if (!badge) return;
  badge.className = `sync-badge ${state}`;
  lbl.textContent = label || (state==='synced' ? '同期中' : '未連携');
}

/* ============================================================
   全データクリア（ログアウト・初期化共通）
   ============================================================ */
const KK_STORAGE_KEYS = [
  'kk_categories','kk_income_sources','kk_payment_methods',
  'kk_accounts','kk_transactions','kk_card_billings',
  'kk_income_actual','kk_income_history','kk_monthly_budgets',
  'kk_savings_first','kk_envelope_reset_ym'
];

function clearAllLocalData(){
  KK_STORAGE_KEYS.forEach(k => localStorage.removeItem(k));
}

function onSyncBadgeClick(){
  if (!currentUser) {
    skipLoginMode = false;
    showLoginScreen();
  } else {
    showConfirm(`${currentUser.email}\nログアウトしますか？`, async () => {
      // 保留中の自動保存タイマーをキャンセルし、未保存の変更があれば
      // ログアウト前に必ずこのアカウント宛てに保存しておく
      // （これをしないと、後で古いタイマーが発火して別アカウントに誤って
      // 書き込んでしまったり、最後の編集が失われたりすることがあった）
      clearTimeout(_saveToFirestoreTimer);
      try { await saveToFirestore(); } catch(e) { console.warn('Logout flush save error:', e); }

      stopRealtimeSync();
      auth.signOut().then(() => {
        // ログアウト時にlocalStorageのアプリデータを全クリア
        clearAllLocalData();
        currentUser = null;
        // AppStateもリセット
        AppState.categories = [];
        AppState.incomeSources = [];
        AppState.paymentMethods = [];
        AppState.accounts = [];
        AppState.transactions = [];
        AppState.cardBillings = {};
        updateSyncBadge('offline', '未連携');
        showToast('ログアウトしました');
        showLoginScreen();
      });
    }, 'ログアウト');
  }
}

function deleteAllData(){
  showConfirm(
    'すべてのデータを削除して初期状態に戻します。\nこの操作は取り消せません。本当に実行しますか？',
    async () => {
      clearAllLocalData();
      initNewUser();
      // Firestoreにも空データを保存
      if (currentUser) await saveToFirestore();
      showToast('データを削除しました。初期状態に戻りました');
      goToPage('home');
    },
    '削除する'
  );
}

/* ============================================================
   バックアップ（ファイル書き出し／読み込み・クラウドの直前状態への復元）
   ============================================================ */
function buildBackupObject(){
  return {
    kk_categories: AppState.categories,
    kk_income_sources: AppState.incomeSources,
    kk_payment_methods: AppState.paymentMethods,
    kk_accounts: AppState.accounts,
    kk_transactions: AppState.transactions,
    kk_card_billings: AppState.cardBillings,
    kk_income_actual: stor('kk_income_actual') || {},
    kk_monthly_budgets: stor('kk_monthly_budgets') || {},
    kk_envelope_reset_ym: stor('kk_envelope_reset_ym') || null,
    kk_savings_first: stor('kk_savings_first') || {},
    kk_income_history: stor('kk_income_history') || {},
    exportedAt: Date.now(),
  };
}

function exportBackupData(){
  const backup = buildBackupObject();
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `kakeibo-backup-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('バックアップファイルを保存しました');
}

function triggerImportBackup(){
  const input = document.getElementById('backup-import-input');
  if (input) input.click();
}

function importBackupFile(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch(err) {
      showToast('ファイルの読み込みに失敗しました（正しいバックアップファイルか確認してください）');
      return;
    }
    showConfirm('このバックアップファイルの内容で、今のデータを上書きします。よろしいですか？', () => {
      applyBackupObject(data);
      showToast('バックアップから復元しました');
      goToPage('home');
    }, '復元する');
  };
  reader.readAsText(file);
  input.value = '';
}

function applyBackupObject(d){
  AppState.categories = d.kk_categories || [];
  AppState.incomeSources = d.kk_income_sources || [];
  AppState.paymentMethods = d.kk_payment_methods || [];
  AppState.accounts = d.kk_accounts || [];
  AppState.transactions = d.kk_transactions || [];
  AppState.cardBillings = d.kk_card_billings || {};
  stor('kk_income_actual', d.kk_income_actual || {});
  stor('kk_monthly_budgets', d.kk_monthly_budgets || {});
  stor('kk_envelope_reset_ym', d.kk_envelope_reset_ym || null);
  stor('kk_savings_first', d.kk_savings_first || {});
  stor('kk_income_history', d.kk_income_history || {});
  saveLocalState();
  if (currentUser) saveToFirestore();
}

async function restoreFromCloudBackup(){
  if (!currentUser || !db_fs) { showToast('ログインしていないと使えません'); return; }
  showConfirm('クラウドに残っている「ひとつ前の状態」から復元します。今のデータは上書きされます。よろしいですか？', async () => {
    try {
      const snap = await db_fs.collection('users').doc(currentUser.uid)
        .collection('kakeibo_app').doc('data_backup_prev').get();
      if (!snap.exists) {
        showToast('バックアップが見つかりませんでした');
        return;
      }
      applyBackupObject(snap.data());
      showToast('ひとつ前の状態から復元しました');
      goToPage('home');
    } catch(e) {
      console.warn('Cloud backup restore error:', e);
      showToast('復元に失敗しました');
    }
  }, '復元する');
}

/* ============================================================
   手動同期（読み込み・書き込みを別々に実行）
   複数端末を行き来していて自動同期の結果に不安がある時、
   どちらの内容を優先するかを利用者が自分で決められるようにする。
   ============================================================ */
async function manualPullFromCloud(){
  if (!currentUser || !db_fs) { showToast('ログインしていないと使えません'); return; }
  showConfirm('クラウドの内容で、この端末のデータを上書きして読み込みます。よろしいですか？', async () => {
    try {
      updateSyncBadge('syncing', '読み込み中');
      // キャッシュではなく必ずサーバーの最新内容を取りに行く
      const snap = await db_fs.collection('users').doc(currentUser.uid)
        .collection('kakeibo_app').doc('data').get({ source: 'server' });
      if (!snap.exists) {
        showToast('クラウドにまだデータがありません');
        updateSyncBadge('synced', currentUser.email.split('@')[0]);
        return;
      }
      const d = snap.data();
      applyCloudSnapshot(d, d.updatedAt || Date.now(), currentUser.uid);
      markInitialSyncComplete();
      showToast('クラウドから読み込みました');
      refreshActivePage();
      updateSyncBadge('synced', currentUser.email.split('@')[0]);
    } catch(e) {
      console.warn('Manual pull error:', e);
      showToast('読み込みに失敗しました');
      updateSyncBadge('synced', currentUser.email.split('@')[0]);
    }
  }, '読み込む');
}

async function manualPushToCloud(){
  if (!currentUser || !db_fs) { showToast('ログインしていないと使えません'); return; }
  showConfirm('この端末の今のデータで、クラウドを上書きします。よろしいですか？', async () => {
    try {
      updateSyncBadge('syncing', '書き込み中');
      clearTimeout(_saveToFirestoreTimer);
      await saveToFirestore();
      markInitialSyncComplete();
      showToast('クラウドへ書き込みました');
      updateSyncBadge('synced', currentUser.email.split('@')[0]);
    } catch(e) {
      console.warn('Manual push error:', e);
      showToast('書き込みに失敗しました');
      updateSyncBadge('synced', currentUser.email.split('@')[0]);
    }
  }, '書き込む');
}

initApp();
