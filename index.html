<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家計手帖</title>
<meta name="theme-color" content="#C1683F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計手帖">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');

  :root {
    --cream: #F7F2E9;
    --cream-deep: #EFE6D4;
    --ink: #3A332B;
    --ink-soft: #756B5C;
    --terracotta: #C1683F;
    --terracotta-deep: #A8552F;
    --terracotta-soft: #E8C4AC;
    --sage: #7C8B6F;
    --sage-deep: #5F6E52;
    --sage-soft: #DDE3D3;
    --gold: #B8923F;
    --gold-soft: #E8D9B0;
    --line: #D9CFBC;
    --white: #FFFEFB;
    --red-deficit: #B5483A;
    --red-soft: #F0D4CD;
    --blue-card: #6B85B0;
    --purple-card: #9B82A8;
    --gray-muted: #9B9180;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    overscroll-behavior-y: none;
  }

  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: var(--cream);
    color: var(--ink);
    background-image: radial-gradient(circle at 1px 1px, rgba(58,51,43,0.04) 1px, transparent 0);
    background-size: 22px 22px;
    min-height: 100vh;
    padding-bottom: 100px;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
  }

  /* スピナー（上下矢印）非表示 */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .mincho { font-family: 'Shippori Mincho', serif; }

  /* ===== ログイン画面 ===== */
  #login-screen {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #3A332B 0%, #5A4A36 50%, #C1683F 130%);
    z-index: 1000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  #login-screen.show { display: flex; }
  .login-logo {
    font-family: 'Shippori Mincho', serif;
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .login-sub {
    font-size: 16px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 40px;
    letter-spacing: 0.15em;
  }
  .auth-tabs {
    display: flex;
    background: rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 4px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 20px;
  }
  .auth-tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: rgba(255,255,255,0.7);
  }
  .auth-tab.active { background: #fff; color: var(--ink); }
  .auth-form { width: 100%; max-width: 320px; }
  .auth-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: none;
    font-size: 15px;
    margin-bottom: 10px;
    box-sizing: border-box;
    background: rgba(255,255,255,0.96);
    color: var(--ink);
    font-family: 'Zen Maru Gothic', sans-serif;
  }
  .auth-input:focus { outline: 2px solid var(--terracotta); }
  .auth-submit {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    border: none;
    background: var(--terracotta);
    color: #fff;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    box-shadow: 0 8px 20px rgba(193,104,63,0.35);
  }
  .auth-submit:disabled { opacity: 0.6; }
  .auth-skip {
    width: 100%;
    padding: 12px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.65);
    border: 1px solid rgba(255,255,255,0.18);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 15px;
    cursor: pointer;
  }
  .auth-error {
    color: #FFD4CC;
    font-size: 15px;
    margin-top: 14px;
    text-align: center;
    display: none;
  }
  .auth-note {
    color: rgba(255,255,255,0.4);
    font-size: 15px;
    margin-top: 24px;
    text-align: center;
    line-height: 1.8;
  }

  /* ===== ヘッダー ===== */
  .app-header {
    padding: 24px 20px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--cream);
  }
  .app-header::after {
    content: "";
    position: absolute;
    bottom: 0; left: 20px; right: 20px;
    height: 1px;
    background: repeating-linear-gradient(90deg, var(--line) 0, var(--line) 6px, transparent 6px, transparent 12px);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .header-title-wrap { display: flex; align-items: baseline; gap: 10px; }
  .header-top h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .month-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--white);
    padding: 4px 6px;
    border-radius: 100px;
    border: 1px solid var(--terracotta-soft);
  }
  .month-selector button {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--terracotta);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .month-selector span {
    font-family: 'Shippori Mincho', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--terracotta);
    min-width: 64px;
    text-align: center;
  }
  .sync-badge {
    display: flex; align-items: center; gap: 5px;
    font-size: 16px; font-weight: 700;
    padding: 5px 10px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    background: var(--white);
    color: var(--gray-muted);
  }
  .sync-badge.synced { color: var(--sage); }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gray-muted); }
  .sync-badge.synced .sync-dot { background: var(--sage); }
  .sync-badge.syncing .sync-dot { background: var(--gold); }
  .reload-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--white);
    font-size: 15px; color: var(--ink-soft); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  @keyframes spin-reload { to { transform: rotate(360deg); } }
  .reload-btn.spin { animation: spin-reload 0.6s linear; }

  /* ===== コンテンツ共通 ===== */
  .content { padding: 18px 20px; }
  .page { display: none; }
  .page.active { display: block; }

  .section-title {
    font-family: 'Shippori Mincho', serif;
    font-size: 15px;
    font-weight: 700;
    margin: 22px 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-title .label { display: flex; align-items: center; gap: 8px; }
  .section-title .label::before {
    content: "";
    width: 4px; height: 15px;
    background: var(--terracotta);
    border-radius: 2px;
  }
  .section-title:first-child { margin-top: 0; }
  .income-input-btn {
    width: 100%; margin: 10px 0 4px;
    padding: 13px 16px;
    background: var(--white);
    border: 1.5px dashed var(--terracotta-soft);
    border-radius: 14px;
    display: flex; align-items: center; gap: 10px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 16px; font-weight: 700;
    color: var(--terracotta);
    cursor: pointer;
    box-shadow: 0 2px 0 var(--line);
  }
  .savings-first-card {
    background: var(--white);
    border-radius: 16px;
    padding: 16px 18px;
    margin: 12px 0 0;
    box-shadow: 0 2px 0 var(--line);
    border-left: 4px solid var(--sage);
  }
  .savings-first-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 16px; font-weight: 700; color: var(--sage-deep);
    margin-bottom: 10px;
  }
  .savings-notice {
    margin-left: auto;
    font-size: 16.5px; font-weight: 700;
    color: var(--terracotta);
    background: var(--terracotta-soft);
    padding: 3px 10px; border-radius: 100px;
  }
  .savings-first-btn-open {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1.5px dashed var(--sage);
    background: var(--sage-soft);
    color: var(--sage-deep);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    display: block;
  }
  .savings-first-saved {
    font-size: 15.5px; color: var(--gray-muted);
    margin-top: 8px;
  }
  .section-link { font-size: 15px; color: var(--terracotta); font-weight: 700; cursor: pointer; }

  /* ===== ホーム：ジャンル別カード ===== */
  .home-genre-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 12px 0 0;
  }
  .home-genre-card {
    background: var(--white);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 2px 0 var(--line);
    position: relative;
    overflow: hidden;
    text-align: left;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .home-genre-card::before {
    content: "";
    position: absolute;
    top: -24px; right: -24px;
    width: 70px; height: 70px;
    background: var(--accent, var(--terracotta-soft));
    border-radius: 50%;
    opacity: 0.3;
  }
  .home-genre-card.full { grid-column: span 2; padding: 20px; }
  .hg-label {
    font-size: 12px; color: var(--gray-muted);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
    position: relative; z-index: 1;
  }
  .hg-value {
    font-family: 'Shippori Mincho', serif;
    font-size: 24px; font-weight: 700;
    position: relative; z-index: 1;
    margin-bottom: 12px;
  }
  .hg-value.big { font-size: 30px; }
  .hg-delta {
    display: inline-flex;
    align-items: center;
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 100px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }

</style>

<script>
/* ============================================================
   データモデル初期値（共有用に空の状態。既存アカウントのデータには影響しません）
   ============================================================ */
const DEFAULT_CATEGORIES = [];

const DEFAULT_INCOME_SOURCES = [];

const DEFAULT_PAYMENT_METHODS = [
  {name:'現金', isCard:false, color:'#B8923F'},
  {name:'クレジットカード', isCard:true, color:'#C1683F'},
];

const DEFAULT_ACCOUNTS = [];

/* 過去データ（新規ユーザー・共有用にはサンプルデータを含めない） */
const HISTORICAL_DATA = {};

/* ============================================================
   アプリ状態管理
   ============================================================ */
const AppState = {
  categories: [],
  incomeSources: [],
  paymentMethods: [],
  accounts: [],
  transactions: [],
  cardBillings: {},
  currentMonth: null,
  initialized: false,
  editingTxId: null,
};

function pad2(n){ return String(n).padStart(2,'0'); }
function todayYM(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; }
function todayYMD(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function fmtYen(n){ return '¥' + Math.round(n).toLocaleString(); }
function fmtYenSigned(n){ const r = Math.round(n); return (r>=0?'+':'') + '¥' + r.toLocaleString(); }
function monthLabel(ym){ const [y,m] = ym.split('-'); return `${y}年${parseInt(m)}月`; }

function stor(k,v){
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null');
    localStorage.setItem(k, JSON.stringify(v));
  } catch(e) { return null; }
}

function loadLocalState(){
  AppState.categories = stor('kk_categories') || JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
  AppState.incomeSources = stor('kk_income_sources') || JSON.parse(JSON.stringify(DEFAULT_INCOME_SOURCES));
  AppState.paymentMethods = stor('kk_payment_methods') || JSON.parse(JSON.stringify(DEFAULT_PAYMENT_METHODS));
  AppState.accounts = stor('kk_accounts') || JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
  AppState.transactions = stor('kk_transactions');
  AppState.cardBillings = stor('kk_card_billings') || {};

  // マイグレーション: 「貯蓄返済」グループを「貯蓄」「返済」に分割
  const savingsNames = ['貯金','七海貯金','結桜貯金','車検','更新費'];
  let migrated = false;
  AppState.categories.forEach(c => {
    if (c.group === '貯蓄返済') {
      c.group = savingsNames.includes(c.name) ? '貯蓄' : '返済';
      migrated = true;
    }
  });
  if (migrated) stor('kk_categories', AppState.categories);

  if (AppState.transactions === null) {
    AppState.transactions = buildTransactionsFromHistorical();
    AppState.cardBillings = buildCardBillingsFromHistorical();
    saveLocalState();
  }

  // マイグレーション：設定›収入の保存履歴（kk_income_history）を通常の記帳（収入ジャンル）へ統合
  // 以前は収入だけ別管理で「履歴」に出てこないバグがあったための恒久対応。毎回チェックし、
  // 未反映分があれば取り込む（重複防止チェック付きなので何度実行しても安全）
  migrateIncomeHistoryToTransactions();

  // マイグレーション：ジャンル未設定の古い記帳に、確定したジャンルを一度だけ書き込む。
  // 「項目名の一致」では絶対に判定しない（同名の収入項目と支出項目があると誤判定するため）。
  // この機能が無かった頃の記帳は仕組み上すべて支出系（収入は別管理だった）なので、
  // isIncomeフラグ→項目のグループの順だけで安全に判定できる。
  backfillTransactionGenres();

  // マイグレーション：旧「締め日」設定を、開始/終了の明示的な請求範囲設定に変換
  migrateCardClosingDayToRange();
}

// kk_income_history（設定›収入の保存履歴）の各月・各項目の最新値を、
// 通常の記帳（AppState.transactions、ジャンル＝収入）として取り込む
function migrateIncomeHistoryToTransactions(){
  const hist = stor('kk_income_history') || {};
  if (!hist || Object.keys(hist).length === 0) return false;

  let changed = false;
  Object.keys(hist).forEach(ym => {
    const byName = hist[ym] || {};
    const parts = ym.split('-');
    if (parts.length !== 2) return;
    const [y, m] = parts;
    Object.keys(byName).forEach(name => {
      const entries = byName[name] || [];
      if (entries.length === 0) return;
      const latest = entries[entries.length - 1];
      if (!latest || !latest.amount || latest.amount <= 0) return;
      const day = (latest.day && latest.day >= 1 && latest.day <= 31)
        ? latest.day
        : (latest.savedAt ? new Date(latest.savedAt).getDate() : 1);
      const date = `${y}-${pad2(parseInt(m,10))}-${pad2(day)}`;
      const already = AppState.transactions.some(t =>
        txGenre(t) === '収入' && t.category === name && t.date === date && Math.round(t.amount) === Math.round(latest.amount)
      );
      if (!already) {
        AppState.transactions.push({
          id: nextTxId(),
          date, amount: latest.amount, category: name, method: '収入', memo: '',
          genre: '収入', isIncome: true,
          createdAt: latest.savedAt || Date.now(),
        });
        changed = true;
      }
    });
  });

  if (changed) saveLocalState();
  return changed;
}

// ジャンル未設定（genreフィールドが無い）の記帳に、確定した値を書き込んで永続化する。
// 項目名だけでの推測は行わない。isIncomeフラグが立っていれば収入、それ以外は
// 項目（カテゴリ）自身のグループだけを見て判定する（同名の収入項目があっても混同しない）。
function backfillTransactionGenres(){
  let changed = false;
  AppState.transactions.forEach(t => {
    if (t.genre && GENRES.includes(t.genre)) return; // すでに確定済み
    let g;
    if (t.isIncome) {
      g = '収入';
    } else {
      const cat = AppState.categories.find(c => c.name === t.category);
      const group = cat ? cat.group : null;
      if (group === '貯蓄') g = '貯蓄';
      else if (group === '返済') g = '返済';
      else if (group === '投資保険') g = '投資';
      else g = '支出';
    }
    t.genre = g;
    changed = true;
  });
  if (changed) saveLocalState();
  return changed;
}

let _saveToFirestoreTimer = null;

function saveLocalState(){
  stor('kk_categories', AppState.categories);
  stor('kk_income_sources', AppState.incomeSources);
  stor('kk_payment_methods', AppState.paymentMethods);
  stor('kk_accounts', AppState.accounts);
  stor('kk_transactions', AppState.transactions);
  stor('kk_card_billings', AppState.cardBillings);
  if (currentUser) {
    // このアカウントでの「未同期の変更」があったことを記録（クラウドとの新旧比較に使用）
    stor('kk_pending_change_' + currentUser.uid, Date.now());
    if (_initialSyncComplete) {
      // 連続した変更を1.5秒後にまとめてFirestoreへ送信
      clearTimeout(_saveToFirestoreTimer);
      _saveToFirestoreTimer = setTimeout(() => saveToFirestore(), 1500);
    } else {
      // ログイン直後などクラウドからの最初の同期がまだ終わっていない間は、
      // 空のデータをうっかり書き込んでしまわないよう送信を保留する。
      // 同期完了後にまとめて送信される。
      _pendingSaveDuringSync = true;
    }
  }
}

let _txIdCounter = 1;
function nextTxId(){
  return Date.now().toString(36) + '_' + (_txIdCounter++);
}

function buildTransactionsFromHistorical(){
  const txs = [];
  Object.keys(HISTORICAL_DATA).forEach(ym => {
    const [y,m] = ym.split('-');
    const monthData = HISTORICAL_DATA[ym];
    monthData.transactions.forEach(t => {
      const day = (t.day && t.day >= 1 && t.day <= 31) ? t.day : 1;
      txs.push({
        id: nextTxId(),
        date: `${y}-${m}-${pad2(day)}`,
        amount: t.amount,
        category: t.category,
        method: t.method,
        memo: '',
        createdAt: Date.now()
      });
    });
  });
  return txs;
}

function buildCardBillingsFromHistorical(){
  const cb = {};
  Object.keys(HISTORICAL_DATA).forEach(ym => {
    const billing = HISTORICAL_DATA[ym].card_billing_actual;
    if (billing && Object.keys(billing).length > 0) {
      cb[ym] = billing;
    }
  });
  return cb;
}

/* ============================================================
   集計ロジック
   ============================================================ */
function getTransactionsForMonth(ym){
  return AppState.transactions.filter(t => t.date.startsWith(ym));
}

function isIncomeCategory(catName){
  return AppState.incomeSources.some(s => s.name === catName);
}

/* ============================================================
   ジャンル（収入・支出・貯蓄・返済・投資）
   ============================================================ */
const GENRES = ['収入','支出','貯蓄','返済','投資'];

// 表示用ラベル（内部のジャンル値／項目グループ名はそのまま。表示名だけ変更）
const GENRE_LABELS = { 収入:'収入', 支出:'支出', 貯蓄:'先取り貯金', 返済:'返済', 投資:'投資・保険' };
function genreLabel(genre){ return GENRE_LABELS[genre] || genre; }

// 記帳ごとのジャンルを判定。tx.genreが最優先（新規記帳は必ずこれが入る）。
// 無い場合（機能追加前の古い記帳）はisIncomeフラグ→項目グループの順で判定するが、
// 「項目名」だけでの判定は絶対に行わない（収入項目と同名の支出項目があると誤判定するため）。
function txGenre(t){
  if (t.genre && GENRES.includes(t.genre)) return t.genre;
  if (t.isIncome) return '収入';
  const cat = AppState.categories.find(c => c.name === t.category);
  const group = cat ? cat.group : null;
  if (group === '貯蓄') return '貯蓄';
  if (group === '返済') return '返済';
  if (group === '投資保険') return '投資';
  return '支出';
}

// 指定した月のジャンル別合計
function getGenreTotals(ym){
  const txs = getTransactionsForMonth(ym);
  const totals = { 収入: 0, 支出: 0, 貯蓄: 0, 返済: 0, 投資: 0 };
  txs.forEach(t => { totals[txGenre(t)] += t.amount; });
  return totals;
}

// 履歴ページ表示用（収入も含め、すべての記帳はAppState.transactionsに統一されている）
function getHistoryDisplayTxs(ym){
  return getTransactionsForMonth(ym);
}

// 「設定›項目」の特定カテゴリ（AppState.categories配列の要素）からジャンルを判定する。
// 呼び出し元は必ず項目（カテゴリ）配列の要素名を渡す想定なので、収入項目名との一致は見ない
// （同名の収入項目があっても、ここは常にそのカテゴリ自身のグループだけで判定する）。
function categoryGenre(catName){
  const cat = AppState.categories.find(c => c.name === catName);
  const group = cat ? cat.group : null;
  if (group === '貯蓄') return '貯蓄';
  if (group === '返済') return '返済';
  if (group === '投資保険') return '投資';
  return '支出';
}

// ジャンルに応じた「項目」ドラムの選択肢
function categoryOptionsForGenre(genre){
  if (genre === '収入') return AppState.incomeSources.map(s => s.name);
  if (genre === '貯蓄') return AppState.categories.filter(c => c.group === '貯蓄').map(c => c.name);
  if (genre === '返済') return AppState.categories.filter(c => c.group === '返済').map(c => c.name);
  if (genre === '投資') {
    const inv = AppState.categories.filter(c => c.group === '投資保険').map(c => c.name);
    return inv.length ? inv : AppState.categories.map(c => c.name);
  }
  // 支出：貯蓄・返済グループを除いた項目
  return AppState.categories.filter(c => c.group !== '貯蓄' && c.group !== '返済').map(c => c.name);
}

// 項目（カテゴリ）の実績金額。収入項目と同じ名前でも絶対に混ざらないよう、
// ジャンルが「収入」の記帳は必ず除外する（封筒・予算まわりの専用ヘルパー）
function getCategoryActualForMonth(ym, catName){
  return getTransactionsForMonth(ym)
    .filter(t => t.category === catName && txGenre(t) !== '収入')
    .reduce((a,t) => a + t.amount, 0);
}

function getMonthSummary(ym){
  const txs = getTransactionsForMonth(ym);

  // カテゴリのグループを素早く引けるようにMap化
  const catGroupMap = {};
  AppState.categories.forEach(c => { catGroupMap[c.name] = c.group || '変動費'; });

  let income = 0;    // 収入（ジャンル＝収入の記帳、設定›収入からの記帳もすべて含む）
  let expense = 0;   // 変動費・固定費・投資保険など
  let savings = 0;   // 貯蓄グループ
  let repayment = 0; // 返済グループ
  const byCategory = {};

  txs.forEach(t => {
    if (t.isIncome || txGenre(t) === '収入') { income += t.amount; return; }
    // byCategoryは支出・貯蓄・返済・投資保険カテゴリの集計専用。
    // 収入項目と同じ名前の項目があっても混ざらないよう、収入は含めない。
    byCategory[t.category] = (byCategory[t.category]||0) + t.amount;
    const group = catGroupMap[t.category] || '変動費';
    if (group === '貯蓄') {
      savings += t.amount;
    } else if (group === '返済') {
      repayment += t.amount;
    } else {
      expense += t.amount;
    }
  });

  const totalSpend = expense + savings + repayment;
  const budgetTotal = AppState.categories.reduce((a,c)=>a+(c.budget||0), 0);

  return { income, expense, savings, repayment, totalSpend, byCategory, budgetTotal,
    balance: income - totalSpend, budgetDiff: budgetTotal - totalSpend };
}

// 各収入項目の「最新保存値」を合算した収入合計
function calcIncomeFromHistory(ym){
  const hist = stor('kk_income_history') || {};
  const ymHist = hist[ym] || {};
  let total = 0;
  Object.keys(ymHist).forEach(name => {
    const entries = ymHist[name];
    if (entries && entries.length > 0) {
      // 最後に保存した値を採用
      total += entries[entries.length - 1].amount || 0;
    }
  });
  return total;
}

function getIncomeActualForMonth(ym){
  const stored = stor('kk_income_actual') || {};
  if (stored[ym]) return stored[ym];
  if (HISTORICAL_DATA[ym] && HISTORICAL_DATA[ym].income_actual) {
    return HISTORICAL_DATA[ym].income_actual;
  }
  return {};
}

function setIncomeActualForMonth(ym, data){
  const stored = stor('kk_income_actual') || {};
  stored[ym] = data;
  stor('kk_income_actual', stored);
}

// 「今月/先月/先々月のX日」から実際の日付を計算する
function resolveRangeDate(referenceYm, monthsBack, day){
  const [y, m] = referenceYm.split('-').map(Number);
  const d = new Date(y, m - 1 - (monthsBack || 0), 1);
  const ty = d.getFullYear(), tm = d.getMonth() + 1;
  const daysInTargetMonth = new Date(ty, tm, 0).getDate();
  const safeDay = day ? Math.min(day, daysInTargetMonth) : daysInTargetMonth; // day未指定/null＝月末
  return `${ty}-${pad2(tm)}-${pad2(safeDay)}`;
}

// カードの請求範囲（開始・終了とも「今月/先月/先々月の◯日」で個別指定）に基づいて
// 実際の集計対象期間を計算する。未設定の場合は暦月（1日〜末日）のまま。
function getCardStatementRange(card, referenceYm){
  if (!card) {
    const [y, m] = referenceYm.split('-').map(Number);
    return { startDate: `${referenceYm}-01`, endDate: `${referenceYm}-${pad2(new Date(y,m,0).getDate())}` };
  }
  const startMonthsBack = card.rangeStartMonthsBack != null ? card.rangeStartMonthsBack : 0;
  const startDay = card.rangeStartDay || 1;
  const endMonthsBack = card.rangeEndMonthsBack != null ? card.rangeEndMonthsBack : 0;
  const endDay = card.rangeEndDay || null; // null＝月末

  return {
    startDate: resolveRangeDate(referenceYm, startMonthsBack, startDay),
    endDate: resolveRangeDate(referenceYm, endMonthsBack, endDay),
  };
}

// 旧「締め日」設定からの一度きりの移行（closingDay → 開始/終了の明示的な範囲設定）
function migrateCardClosingDayToRange(){
  let changed = false;
  AppState.paymentMethods.forEach(m => {
    if (!m.isCard) return;
    if (m.rangeStartMonthsBack !== undefined) return; // 既に移行済み
    if (m.closingDay) {
      m.rangeStartMonthsBack = 1;
      m.rangeStartDay = m.closingDay + 1;
      m.rangeEndMonthsBack = 0;
      m.rangeEndDay = m.closingDay;
    } else {
      m.rangeStartMonthsBack = 0;
      m.rangeStartDay = 1;
      m.rangeEndMonthsBack = 0;
      m.rangeEndDay = null;
    }
    delete m.closingDay;
    changed = true;
  });
  if (changed) saveLocalState();
  return changed;
}

function getCardUsageForMonth(ym, cardName){
  const card = AppState.paymentMethods.find(m => m.name === cardName);
  const range = getCardStatementRange(card, ym);
  return AppState.transactions
    .filter(t => t.method === cardName && !t.isIncome && t.date >= range.startDate && t.date <= range.endDate)
    .reduce((a,t) => a + t.amount, 0);
}

function getCardBillingForMonth(ym, cardName){
  const cb = AppState.cardBillings[ym];
  if (cb && cb[cardName] !== undefined) return cb[cardName];
  return null;
}

function setCardBillingForMonth(ym, cardName, amount){
  if (!AppState.cardBillings[ym]) AppState.cardBillings[ym] = {};
  AppState.cardBillings[ym][cardName] = amount;
  saveLocalState();
}

   画面遷移
   ============================================================ */
function goToIncomeSettings(){
  _settingsTab = 'income';
  goToPage('settings');
}

function goToPage(page){
  // 設定・理想の目標ページから離脱する場合、保留中のFirestore保存を即時実行
  // （ただし、ログイン直後などまだクラウドとの最初のすり合わせが済んでいない間は、
  // 空のデータを誤って書き込んでしまわないよう実行しない）
  const currentPage = document.querySelector('.page.active')?.id?.replace('page-','');
  if ((currentPage === 'settings' || currentPage === 'goals') && page !== currentPage) {
    clearTimeout(_saveToFirestoreTimer);
    if (currentUser && _initialSyncComplete) saveToFirestore();
  }

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.page === page);
  });
  const titles = {home:'家計手帖', history:'履歴', analysis:'分析', cards:'カード管理', envelope:'封筒管理', settings:'設定', goals:'理想の目標'};
  document.getElementById('page-title').textContent = titles[page] || '家計手帖';
  document.getElementById('month-selector-wrap').style.display = (page==='settings' || page==='goals') ? 'none' : 'flex';
  document.getElementById('fab-add').style.display = (page==='settings' || page==='goals') ? 'none' : 'flex';

  if (page === 'home') renderHome();
  if (page === 'history') renderHistory();
  if (page === 'analysis') renderAnalysis();
  if (page === 'cards') renderCards();
  if (page === 'envelope') renderEnvelopePage();
  if (page === 'settings') renderSettings();
  if (page === 'goals') renderGoalsPage();

  scrollToTop();
}

function scrollToTop(){
  window.scrollTo(0, 0);
  document.documentElement.scrollTop = 0;
  document.body.scrollTop = 0;
}

function changeMonth(delta){
  const [y,m] = AppState.currentMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  AppState.currentMonth = `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  document.getElementById('current-month-label').textContent = monthLabel(AppState.currentMonth);
  _historyFilterDay = null;
  _historyFilterCategory = null;
  _historyFilterMethod = null;
  const activePage = document.querySelector('.page.active').id.replace('page-','');
  if (activePage === 'home') renderHome();
  if (activePage === 'history') renderHistory();
  if (activePage === 'analysis') renderAnalysis();
  if (activePage === 'cards') renderCards();
  if (activePage === 'envelope') renderEnvelopePage();
}

/* ============================================================
   ホーム画面描画
   ============================================================ */
function renderHome(){
  const ym = AppState.currentMonth;
  const summary = getMonthSummary(ym);

  // 先月の収入を取得
  const [y,m] = ym.split('-').map(Number);
  const prevDate = new Date(y, m-2, 1);
  const prevYm = `${prevDate.getFullYear()}-${pad2(prevDate.getMonth()+1)}`;
  const prevSummary = getMonthSummary(prevYm);

  // 収支バランス = 先月収入 - 今月支出
  const balance = prevSummary.income - summary.totalSpend;

  const balEl = document.getElementById('home-balance');
  balEl.innerHTML = `<span class="yen">¥</span>${Math.round(balance).toLocaleString()}`;
  balEl.classList.toggle('minus', balance < 0);

  document.getElementById('home-income').textContent = fmtYen(prevSummary.income);
  document.getElementById('home-expense').textContent = fmtYen(summary.totalSpend);

  // ジャンル別カード（収入・支出・貯蓄・投資・返済）
  renderHomeGenreCards(ym);

  const catListEl = document.getElementById('home-category-list');
  const sortedCats = AppState.categories
    .map(c => ({...c, actual: summary.byCategory[c.name] || 0}))
    .filter(c => c.actual > 0 || c.budget > 0)
    .sort((a,b) => b.actual - a.actual)
    .slice(0, 8);

  if (sortedCats.length === 0) {
    catListEl.innerHTML = '<div class="empty-hint">この月のデータがありません</div>';
  } else {
    catListEl.innerHTML = sortedCats.map(c => {
      const pct = c.budget > 0 ? Math.min(100, (c.actual / c.budget) * 100) : (c.actual > 0 ? 100 : 0);
      const over = c.budget > 0 && c.actual > c.budget;
      return `
        <div class="cat-item" style="cursor:pointer" onclick="openCategoryHistoryModal('${escapeJs(c.name)}')">
          <div class="cat-item-top">
            <span class="cat-name">${catNameHtml(c.name)}</span>
            <span class="cat-amount">${fmtYen(c.actual)} ${c.budget>0?`<span class="budget">/ ${fmtYen(c.budget)}</span>`:''} <span style="font-size:14px;color:var(--gray-muted)">›</span></span>
          </div>
          ${catDetailHtml(c.name)}
          <div class="cat-bar-track"><div class="cat-bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>
        </div>`;
    }).join('');
  }

  const cardListEl = document.getElementById('home-card-list');
  const cards = AppState.paymentMethods.filter(m => m.isCard);
  const cardRows = cards.map(card => {
    const usage = getCardUsageForMonth(ym, card.name);
    const billed = getCardBillingForMonth(ym, card.name);
    if (usage === 0 && billed === null) return null;
    const diff = billed !== null ? (billed - usage) : null;
    let diffHtml = '<span class="budget">未確定</span>';
    if (diff !== null) {
      const ok = Math.abs(diff) <= 100;
      diffHtml = `<span style="color:${ok?'var(--sage)':'var(--red-deficit)'};font-weight:700">${ok?'差 一致':'差 '+fmtYenSigned(diff)}</span>`;
    }
    return `
      <div class="cat-item" style="cursor:pointer" onclick="openCardHistoryModal('${escapeJs(card.name)}')">
        <div class="cat-item-top">
          <span class="cat-name">${escapeHtml(card.name)}</span>
          <span class="cat-amount">利用 ${fmtYen(usage)} <span style="font-size:14px;color:var(--gray-muted)">›</span></span>
        </div>
        <div style="font-size:15.5px;text-align:right">${billed!==null?`請求 ${fmtYen(billed)} ・ `:''}${diffHtml}</div>
      </div>`;
  }).filter(Boolean);

  cardListEl.innerHTML = cardRows.length ? cardRows.join('') : '<div class="empty-hint">この月のカード利用はありません</div>';

  const recentEl = document.getElementById('home-recent-tx');
  const recent = getTransactionsForMonth(ym)
    .slice()
    .sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt)
    .slice(0, 8);
  if (recent.length === 0) {
    recentEl.innerHTML = '<div class="empty-hint">この月の記帳がありません</div>';
  } else {
    recentEl.innerHTML = recent.map(t => {
      const genre = txGenre(t);
      const meta = GENRE_CARD_META[genre];
      const genreDot = `<span class="hist-genre-dot" style="background:${meta.color}"></span>`;
      return `
      <div class="cat-item" style="cursor:pointer" onclick="openTxModal('${t.id}')">
        <div class="cat-item-top">
          <span class="cat-name">${genreDot}${catNameHtml(t.category)}</span>
          <span class="cat-amount">${fmtYen(t.amount)}</span>
        </div>
        ${catDetailHtml(t.category)}
        <div style="font-size:16px;color:var(--gray-muted)">${t.date.split('-').slice(1).join('/')} ・ ${escapeHtml(t.method)}${t.memo?' ・ '+escapeHtml(t.memo):''}</div>
      </div>`;
    }).join('');
  }
  injectHistoryStyles();
}

/* ============================================================
   ジャンル別カード（収入・支出・先取り貯金・投資保険・返済）
   ホーム／分析ページ共通のカード生成ロジック
   ============================================================ */
const GENRE_CARD_META = {
  '収入': { icon:'💰', accent:'var(--terracotta-soft)', color:'var(--terracotta)' },
  '支出': { icon:'🧾', accent:'var(--red-soft)', color:'var(--ink)' },
  '貯蓄': { icon:'🏦', accent:'var(--sage-soft)', color:'var(--sage-deep)' },
  '投資': { icon:'📈', accent:'var(--gold-soft)', color:'var(--gold)' },
  '返済': { icon:'💳', accent:'var(--red-soft)', color:'var(--red-deficit)' },
};
// 増加が「良いこと」かどうか（先月比バッジの色分けに使用）
const GENRE_INCREASE_IS_GOOD = { '収入': true, '貯蓄': true, '投資': true, '支出': false, '返済': false };

function genreCardHtml(genre, full, ym, opts){
  opts = opts || {};
  const meta = GENRE_CARD_META[genre];
  const totals = getGenreTotals(ym);

  let deltaHtml = '';
  if (opts.showDelta) {
    const prevMonths = getPastMonths(ym, 2);
    const prevYm = prevMonths[0];
    const prevTotals = getGenreTotals(prevYm);
    const delta = totals[genre] - prevTotals[genre];
    if (totals[genre] !== 0 || prevTotals[genre] !== 0) {
      const isGood = GENRE_INCREASE_IS_GOOD[genre] ? delta >= 0 : delta <= 0;
      deltaHtml = `<div class="hg-delta ${isGood?'up':'down'}">先月比 ${fmtYenSigned(delta)}</div>`;
    }
  }

  const secondaryBtn = opts.trendMode
    ? `<button type="button" class="hg-btn outline" onclick="openGenreTrendModal('${genre}')">推移<span class="hg-btn-icon">›</span></button>`
    : `<button type="button" class="hg-btn outline" onclick="openHomeGenreHistoryModal('${genre}')">履歴<span class="hg-btn-icon">›</span></button>`;

  return `
    <div class="home-genre-card${full?' full':''}" style="--accent:${meta.accent};--accent-strong:${meta.color}">
      <div class="hg-label"><span>${meta.icon}</span><span>${genreLabel(genre)}</span></div>
      <div class="hg-value${full?' big':''}" style="color:${meta.color}">${fmtYen(totals[genre])}</div>
      ${deltaHtml}
      <div class="hg-actions">
        <button type="button" class="hg-btn" onclick="openHomeGenreTxModal('${genre}')"><span class="hg-btn-icon">＋</span>記帳</button>
        ${secondaryBtn}
      </div>
    </div>`;
}

function genreCardsGridHtml(ym, opts){
  return [
    genreCardHtml('貯蓄', true, ym, opts),
    genreCardHtml('収入', false, ym, opts),
    genreCardHtml('支出', false, ym, opts),
    genreCardHtml('投資', false, ym, opts),
    genreCardHtml('返済', false, ym, opts),
  ].join('');
}

function renderHomeGenreCards(ym){
  const el = document.getElementById('home-genre-cards');
  if (!el) return;
  el.innerHTML = genreCardsGridHtml(ym, { showDelta: false });
}

// ジャンルカードから「記帳」：記帳モーダルを開く（ジャンルは固定・変更不可）
function openHomeGenreTxModal(genre){
  const catOptions = categoryOptionsForGenre(genre);
  if (catOptions.length === 0) {
    if (genre === '収入') {
      showToast('設定の「収入」から項目を追加してください');
    } else {
      showToast(`設定に「${genreLabel(genre)}」の項目がありません`);
    }
    return;
  }
  const cashMethod = AppState.paymentMethods.find(m => m.name === '現金');

  AppState.editingTxId = null;
  _selectedTxGenre = genre;
  _txGenreLocked = true;
  _txIsIncome = (genre === '収入');
  _selectedTxCategory = catOptions[0];
  _selectedTxMethod = cashMethod ? '現金' : (AppState.paymentMethods[0]?.name || null);

  document.getElementById('tx-modal-title').textContent = `${genreLabel(genre)}を記帳`;
  document.getElementById('tx-date').value = todayYMD();
  document.getElementById('tx-amount').value = '';
  document.getElementById('tx-memo').value = '';
  document.getElementById('tx-delete-btn').style.display = 'none';
  document.getElementById('tx-submit-btn').textContent = '記帳する';
  updateTxFieldTriggerLabels();
  document.getElementById('tx-modal-overlay').classList.add('show');
}

// ジャンルカードから「履歴」：今月のそのジャンルの記帳一覧（新しい順・タップで編集）
// ホームのジャンルカードの「履歴」：その月にそのジャンルで記帳された項目を、
// 項目ごとの合計金額だけの一覧で表示する（例：食費 10,000円）。
// 項目をタップすると、その項目の記帳一覧（今開いているような画面）が見られる。
function openHomeGenreHistoryModal(genre){
  const ym = AppState.currentMonth;
  const txs = getTransactionsForMonth(ym).filter(t => txGenre(t) === genre);

  const totalsByCat = {};
  txs.forEach(t => { totalsByCat[t.category] = (totalsByCat[t.category]||0) + t.amount; });

  // 設定で並べた順番のまま表示する（金額順にはしない）
  const orderedNames = genre === '収入'
    ? AppState.incomeSources.map(s => s.name)
    : AppState.categories.map(c => c.name);
  const rows = orderedNames
    .filter(name => totalsByCat[name] > 0)
    .map(name => ({ name, amount: totalsByCat[name] }));
  // 設定に見当たらない項目名で記帳されているものがあれば末尾に追加
  Object.keys(totalsByCat).forEach(name => {
    if (!orderedNames.includes(name)) rows.push({ name, amount: totalsByCat[name] });
  });

  const total = rows.reduce((a,r)=>a+r.amount, 0);

  document.getElementById('history-modal-title').textContent = `${genreLabel(genre)}の履歴（${monthLabel(ym)}）`;
  const body = document.getElementById('history-modal-body');
  if (rows.length === 0) {
    body.innerHTML = '<div class="empty-hint">この月の記帳がありません</div>';
  } else {
    body.innerHTML = `
      <div style="font-size:14px;color:var(--gray-muted);padding:0 0 12px;border-bottom:1px dashed var(--line);margin-bottom:4px">
        合計 <strong style="color:var(--ink);font-size:16px">${fmtYen(total)}</strong>（${rows.length}項目）
      </div>
      ${rows.map(r => `
        <div class="cat-item" style="cursor:pointer" onclick="openGenreCategoryHistoryModal('${escapeJs(genre)}','${escapeJs(r.name)}')">
          <div class="cat-item-top">
            <span class="cat-name">${catNameHtml(r.name)}</span>
            <span class="cat-amount">${fmtYen(r.amount)} <span style="font-size:14px;color:var(--gray-muted)">›</span></span>
          </div>
          ${catDetailHtml(r.name)}
        </div>`).join('')}
    `;
  }
  document.getElementById('history-modal-overlay').classList.add('show');
}

// ジャンル履歴の項目をタップした時：その項目・そのジャンルの記帳一覧
function openGenreCategoryHistoryModal(genre, catName){
  const ym = AppState.currentMonth;
  const txs = getTransactionsForMonth(ym).filter(t => t.category === catName && txGenre(t) === genre);
  openHistoryModal(`${catName}の履歴（${monthLabel(ym)}）`, txs);
}

// 分析ページのジャンルカードから「推移」：過去12ヶ月の月別推移（上が直近）
function openGenreTrendModal(genre){
  const ym = AppState.currentMonth;
  const meta = GENRE_CARD_META[genre];
  const months = getPastMonths(ym, 12).slice().reverse(); // 新しい月を上に

  const rows = months.map(m => ({ ym: m, amount: getGenreTotals(m)[genre] }));
  const total = rows.reduce((a,r)=>a+r.amount, 0);
  const monthsWithData = rows.filter(r=>r.amount>0).length || 1;
  const avg = Math.round(total / monthsWithData);
  const maxAmt = Math.max(1, ...rows.map(r=>r.amount));

  const bodyContent = `
    <div style="display:flex;gap:16px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed var(--line)">
      <div>
        <div style="font-size:13px;color:var(--gray-muted)">12ヶ月合計</div>
        <div style="font-size:18px;font-weight:700;font-family:'Shippori Mincho',serif">${fmtYen(total)}</div>
      </div>
      <div>
        <div style="font-size:13px;color:var(--gray-muted)">月平均</div>
        <div style="font-size:18px;font-weight:700;font-family:'Shippori Mincho',serif">${fmtYen(avg)}</div>
      </div>
    </div>
    ${rows.map(r => {
      const barW = Math.round((r.amount / maxAmt) * 100);
      const isCurrent = r.ym === ym;
      return `
        <div style="padding:8px 0;border-bottom:1px solid var(--cream-deep)">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <span style="font-size:14px;font-weight:${isCurrent?'700':'500'};color:${isCurrent?meta.color:'var(--ink)'}">${monthLabel(r.ym)}${isCurrent?' ◀':''}</span>
            <span style="font-size:15px;font-weight:700">${r.amount > 0 ? fmtYen(r.amount) : '—'}</span>
          </div>
          <div style="height:6px;background:var(--cream-deep);border-radius:100px;overflow:hidden">
            <div style="height:100%;width:${barW}%;background:${meta.color};border-radius:100px"></div>
          </div>
        </div>`;
    }).join('')}
  `;

  document.getElementById('history-modal-title').textContent = `${genreLabel(genre)}の推移（直近12ヶ月）`;
  document.getElementById('history-modal-body').innerHTML = bodyContent;
  document.getElementById('history-modal-overlay').classList.add('show');
}

function openCategoryHistoryModal(catName){
  const ym = AppState.currentMonth;
  const txs = getTransactionsForMonth(ym).filter(t => t.category === catName && txGenre(t) !== '収入');
  openHistoryModal(`${catName}の明細（${monthLabel(ym)}）`, txs);
}

function openCardHistoryModal(cardName, targetYm){
  const ym = targetYm || AppState.currentMonth;
  const card = AppState.paymentMethods.find(m => m.name === cardName);
  const range = getCardStatementRange(card, ym);
  const txs = AppState.transactions.filter(t =>
    t.method === cardName && !t.isIncome && t.date >= range.startDate && t.date <= range.endDate
  );
  const periodLabel = range.startDate === `${ym}-01`
    ? monthLabel(ym)
    : `${range.startDate.split('-').slice(1).join('/')}〜${range.endDate.split('-').slice(1).join('/')}`;
  openHistoryModal(`${cardName}の明細（${periodLabel}）`, txs);
}

/* ============================================================
   取引履歴モーダル（項目・カードタップで呼び出し）
   ============================================================ */
function openHistoryModal(title, txs){
  document.getElementById('history-modal-title').textContent = title;
  const body = document.getElementById('history-modal-body');
  const sorted = txs.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);

    body.innerHTML = '<div class="empty-hint">この月の記帳がありません</div>';
  } else {
    body.innerHTML = `
      <div style="font-size:14px;color:var(--gray-muted);padding:0 0 12px;border-bottom:1px dashed var(--line);margin-bottom:4px">
        合計 <strong style="color:var(--ink);font-size:16px">${fmtYen(total)}</strong>（${sorted.length}件）
      </div>
      ${sorted.map(t => {
        const isIncomeHistoryEntry = typeof t.id === 'string' && t.id.startsWith('inc_');
        const tapAction = isIncomeHistoryEntry
          ? `closeHistoryModal();showToast('収入は設定 › 収入から編集できます');goToIncomeSettings();`
          : `openTxModal('${t.id}')`;
        return `
        <div class="cat-item" style="cursor:pointer" onclick="${tapAction}">
          <div class="cat-item-top">

          </div>
          ${catDetailHtml(t.category)}
          <div style="font-size:13px;color:var(--gray-muted)">${t.date.split('-').slice(1).join('/')} ・ ${escapeHtml(t.method)}${t.memo?' ・ '+escapeHtml(t.memo):''}</div>
        </div>`;
      }).join('')}
    `;
  }
  document.getElementById('history-modal-overlay').classList.add('show');
}

function closeHistoryModal(){
  document.getElementById('history-modal-overlay').classList.remove('show');
}

// カテゴリ名 + 詳細をセットで返すHTML（詳細があれば名前の横に小さく表示）
function catNameHtml(catName){
  // 名前のみ返す（詳細は catDetailHtml を使って別行に出す）
  return escapeHtml(catName);
}

function catDetailHtml(catName){
  const cat = AppState.categories.find(c => c.name === catName);
  return (cat && cat.detail) ? `<div class="cat-detail-text">${escapeHtml(cat.detail)}</div>` : '';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   入力モーダル
   ============================================================ */
let _selectedTxCategory = null;
let _selectedTxMethod = null;
let _selectedTxGenre = '支出';
let _txGenreLocked = false; // ホームのジャンルカードから開いた時はジャンル変更不可
let _txIsIncome = false;
let _txCategoryMode = 'all'; // 互換用（未使用箇所が参照してもエラーにならないよう保持）
let _txCategoryFixed = null; // 特定カテゴリ固定モード用

function updateTxFieldTriggerLabels(){
  const genreBtn = document.getElementById('tx-genre-trigger');
  const catBtn = document.getElementById('tx-category-trigger');
  const methodBtn = document.getElementById('tx-method-trigger');
  if (genreBtn) {
    genreBtn.textContent = _selectedTxGenre ? genreLabel(_selectedTxGenre) : '選択してください';
    genreBtn.classList.toggle('empty', !_selectedTxGenre);
    if (_txGenreLocked) {
      genreBtn.classList.add('locked');
      genreBtn.style.opacity = '0.6';
      genreBtn.style.pointerEvents = 'none';
    } else {
      genreBtn.classList.remove('locked');
      genreBtn.style.opacity = '';
      genreBtn.style.pointerEvents = '';
    }
    genreBtn.onclick = () => openTxFieldDrum('genre');
  }
  if (catBtn) {
    catBtn.textContent = _selectedTxCategory || '選択してください';
    catBtn.classList.toggle('empty', !_selectedTxCategory);
    // onclickを常にリセット（上書き対策）
    catBtn.onclick = () => openTxFieldDrum('category');
  }
  if (methodBtn) {
    methodBtn.textContent = _selectedTxMethod || '選択してください';
    methodBtn.classList.toggle('empty', !_selectedTxMethod);
    methodBtn.onclick = () => openTxFieldDrum('method');
  }
}

function openTxFieldDrum(field){
  let values, title, currentVal;
  if (field === 'genre') {
    if (_txGenreLocked) return; // ジャンル固定時は変更不可
    values = GENRES;
    title = 'ジャンルを選択';
    currentVal = _selectedTxGenre;
  } else if (field === 'category') {
    values = categoryOptionsForGenre(_selectedTxGenre);
    title = _selectedTxGenre ? `${genreLabel(_selectedTxGenre)}の項目を選択` : '項目を選択';
    currentVal = _selectedTxCategory;
  } else {
    values = AppState.paymentMethods.map(m => m.name);
    title = '支払い方法を選択';
    currentVal = _selectedTxMethod;
  }
  if (values.length === 0) {
    showToast('設定から項目を追加してください');
    return;
  }
  _drumTargetField = 'tx-' + field;
  const formatter = field === 'genre' ? genreLabel : null;
  buildDrumDOM(title, values, currentVal || values[0], formatter);
}

function openTxModal(txId){
  AppState.editingTxId = txId || null;
  const methods = AppState.paymentMethods.map(m=>m.name);

  let tx = null;
  if (txId) {
    tx = AppState.transactions.find(t => t.id === txId);
  }

  _txGenreLocked = false;
  _selectedTxGenre = tx ? txGenre(tx) : '支出';
  _txIsIncome = _selectedTxGenre === '収入';

  document.getElementById('tx-modal-title').textContent = tx ? '記録を編集' : '記帳する';
  document.getElementById('tx-date').value = tx ? tx.date : todayYMD();
  document.getElementById('tx-amount').value = tx ? tx.amount : '';
  document.getElementById('tx-memo').value = tx ? (tx.memo||'') : '';
  document.getElementById('tx-delete-btn').style.display = tx ? 'block' : 'none';
  document.getElementById('tx-submit-btn').textContent = tx ? '更新する' : '記帳する';

  const catOptions = categoryOptionsForGenre(_selectedTxGenre);
  _selectedTxCategory = tx ? tx.category : (catOptions[0] || null);
  _selectedTxMethod = tx ? tx.method : (methods[0] || null);
  updateTxFieldTriggerLabels();

  document.getElementById('tx-modal-overlay').classList.add('show');
}

function closeTxModal(){
  document.getElementById('tx-modal-overlay').classList.remove('show');
  AppState.editingTxId = null;
  _txGenreLocked = false;
}

function submitTransaction(){
  const date = document.getElementById('tx-date').value;
  const amount = parseFloat(document.getElementById('tx-amount').value);
  const memo = document.getElementById('tx-memo').value.trim();

  if (!date || !amount || amount <= 0) {
    showToast('日付と金額を正しく入力してください');
    return;
  }
  if (!_selectedTxGenre || !_selectedTxCategory || !_selectedTxMethod) {
    showToast('ジャンル・項目・支払い方法を選択してください');
    return;
  }

  if (AppState.editingTxId) {
    const tx = AppState.transactions.find(t => t.id === AppState.editingTxId);
    if (tx) {
      tx.date = date; tx.amount = amount; tx.category = _selectedTxCategory;
      tx.method = _selectedTxMethod; tx.memo = memo;
      tx.genre = _selectedTxGenre;
      tx.isIncome = _selectedTxGenre === '収入';
    }
    showToast('記録を更新しました');
  } else {
    AppState.transactions.push({
      id: nextTxId(), date, amount, category: _selectedTxCategory,
      method: _selectedTxMethod, memo,
      genre: _selectedTxGenre,
      isIncome: _selectedTxGenre === '収入',
      createdAt: Date.now()
    });
    showToast('記帳しました');
  }

  _txIsIncome = false;  // フラグリセット
  _txGenreLocked = false;
  saveLocalState();
  closeTxModal();
  refreshActivePage();
}

function deleteCurrentTransaction(){
  if (!AppState.editingTxId) return;
  const txId = AppState.editingTxId;
  showConfirm('この記録を削除しますか？', () => {
    AppState.transactions = AppState.transactions.filter(t => t.id !== txId);
    saveLocalState();
    closeTxModal();
    refreshActivePage();
  });
}

function refreshActivePage(){
  const activePage = document.querySelector('.page.active').id.replace('page-','');
  if (activePage === 'home') renderHome();
  if (activePage === 'history') renderHistory();
  if (activePage === 'analysis') renderAnalysis();
  if (activePage === 'cards') renderCards();
  // 封筒・設定・理想の目標ページは入力中の内容を消さないよう自動再描画しない
  // （次にそのページを開き直した時に最新データが反映される）
}

/* ============================================================
   トースト
   ============================================================ */
let _toastTimer = null;
function showToast(msg, onClick){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  el.style.cursor = onClick ? 'pointer' : '';
  el.onclick = onClick || null;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=> el.classList.remove('show'), onClick ? 5000 : 2200);
}

/* ============================================================
   カスタム確認ダイアログ（confirm()の代替・サンドボックス環境対応）
   ============================================================ */
let _confirmCallback = null;

function showConfirm(message, onConfirm, okLabel){
  document.getElementById('confirm-message').textContent = message;
  document.getElementById('confirm-ok-btn').textContent = okLabel || '削除する';
  _confirmCallback = onConfirm;
  document.getElementById('confirm-overlay').classList.add('show');
}

function setupConfirmButtons(){
  const okBtn = document.getElementById('confirm-ok-btn');
  const cancelBtn = document.getElementById('confirm-cancel-btn');
  const overlay = document.getElementById('confirm-overlay');
  if (!okBtn || okBtn._bound) return;
  okBtn._bound = true;
  okBtn.onclick = () => {
    overlay.classList.remove('show');
    const cb = _confirmCallback;
    _confirmCallback = null;
    if (cb) cb();
  };
  cancelBtn.onclick = () => {
    overlay.classList.remove('show');
    _confirmCallback = null;
  };
  overlay.onclick = (e) => {
    if (e.target === overlay) {
      overlay.classList.remove('show');
      _confirmCallback = null;
    }
  };
}

/* ============================================================
   履歴ページ（3メイングループ：日付／項目／支払い、各々に絞り込みトグル）
   ============================================================ */
let _historyMainTab = 'date'; // 'genre' | 'date' | 'category' | 'method' | 'amount'
let _historyFilterOn = { genre: false, date: false, category: false, method: false, amount: false };
let _historyFilterDay = null;
let _historyFilterCategory = null;
let _historyFilterMethod = null;
let _historyFilterGenre = null; // ジャンル絞り込み（項目別タブの項目ドラムの候補にも影響）
let _historyFilterAmountMin = null;
let _historyFilterAmountMax = null;
let _historyFilterAmountRaw = ''; // 入力欄の表示保持用

const HISTORY_MAIN_LABELS = { genre: 'ジャンル別', date: '日付順', category: '項目別', method: '支払い別', amount: '金額別' };
const HISTORY_FILTER_LABELS = { genre: 'ジャンルで絞り込み', date: '日付で絞り込み', category: '項目で絞り込み', method: '支払いで絞り込み', amount: '金額で絞り込み' };

function renderHistory(){
  const ym = AppState.currentMonth;
  let txs = getHistoryDisplayTxs(ym).slice();

  const filterIsOn = _historyFilterOn[_historyMainTab];

  if (filterIsOn) {
    if (_historyMainTab === 'date' && _historyFilterDay) {
      txs = txs.filter(t => parseInt(t.date.split('-')[2],10) === parseInt(_historyFilterDay,10));
    }
    if (_historyMainTab === 'category' && _historyFilterCategory) {
      txs = txs.filter(t => t.category === _historyFilterCategory);
    }
    if (_historyMainTab === 'method' && _historyFilterMethod) {
      txs = txs.filter(t => t.method === _historyFilterMethod);
    }
    if (_historyMainTab === 'genre' && _historyFilterGenre) {
      txs = txs.filter(t => txGenre(t) === _historyFilterGenre);
    }
    if (_historyMainTab === 'amount' && (_historyFilterAmountMin !== null || _historyFilterAmountMax !== null)) {
      txs = txs.filter(t =>
        (_historyFilterAmountMin === null || t.amount >= _historyFilterAmountMin) &&
        (_historyFilterAmountMax === null || t.amount <= _historyFilterAmountMax)
      );
    }
  }

  let sorted;
  if (_historyMainTab === 'category') {
    sorted = txs.sort((a,b) => a.category.localeCompare(b.category,'ja') || b.date.localeCompare(a.date));
  } else if (_historyMainTab === 'method') {
    sorted = txs.sort((a,b) => a.method.localeCompare(b.method,'ja') || b.date.localeCompare(a.date));
  } else if (_historyMainTab === 'genre') {
    sorted = txs.sort((a,b) => GENRES.indexOf(txGenre(a)) - GENRES.indexOf(txGenre(b)) || b.date.localeCompare(a.date));
  } else if (_historyMainTab === 'amount') {
    sorted = txs.sort((a,b) => b.amount - a.amount || b.date.localeCompare(a.date));
  } else {
    sorted = txs.sort((a,b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  }

  const total = txs.reduce((a,t)=>a+t.amount, 0);

  let filterTriggerHtml = '';
  if (filterIsOn) {
    if (_historyMainTab === 'date') {
      filterTriggerHtml = `
        <div class="filter-trigger-row">
          <button class="filter-trigger-btn ${_historyFilterDay?'set':''}" onclick="openHistoryFilterDrum('day')">
            <span>${_historyFilterDay ? _historyFilterDay+'日' : '日付を選択'}</span>
            <span class="ft-arrow">▾</span>
          </button>
        </div>`;
    } else if (_historyMainTab === 'category') {
      filterTriggerHtml = `
        <div class="filter-trigger-row">
          <button class="filter-trigger-btn ${_historyFilterCategory?'set':''}" onclick="openHistoryFilterDrum('category')">
            <span>${_historyFilterCategory ? escapeHtml(_historyFilterCategory) : '項目を選択'}</span>
            <span class="ft-arrow">▾</span>
          </button>
        </div>`;
    } else if (_historyMainTab === 'genre') {
      filterTriggerHtml = `
        <div class="filter-trigger-row">
          <button class="filter-trigger-btn ${_historyFilterGenre?'set':''}" onclick="openHistoryFilterDrum('genre')">
            <span>${_historyFilterGenre ? genreLabel(_historyFilterGenre) : 'ジャンルを選択'}</span>
            <span class="ft-arrow">▾</span>
          </button>
        </div>`;
    } else if (_historyMainTab === 'amount') {
      filterTriggerHtml = `
        <div class="amount-filter-row">
          <input type="text" id="amount-filter-input" inputmode="numeric" placeholder="例：5000　／　1000-3000" value="${escapeHtml(_historyFilterAmountRaw)}">
          <button type="button" class="amount-filter-btn" onclick="applyAmountFilter()">検索</button>
        </div>
        <div style="font-size:11px;color:var(--gray-muted);padding:0 2px 8px">数字のみで完全一致、「1000-3000」のように入力すると範囲検索になります</div>`;
    } else {
      filterTriggerHtml = `
        <div class="filter-trigger-row">
          <button class="filter-trigger-btn ${_historyFilterMethod?'set':''}" onclick="openHistoryFilterDrum('method')">
            <span>${_historyFilterMethod ? escapeHtml(_historyFilterMethod) : '支払い方法を選択'}</span>
            <span class="ft-arrow">▾</span>
          </button>
        </div>`;
    }
  }

  // 項目別タブの案内文（ジャンル絞り込み中は候補がそのジャンルの項目に限定される）
  const categoryHint = (_historyMainTab === 'category' && _historyFilterGenre)
    ? `<div style="font-size:11px;color:var(--gray-muted);padding:0 2px 8px">「${genreLabel(_historyFilterGenre)}」の項目候補で絞り込み中（ジャンル別タブで変更できます）</div>`
    : '';

  let html = `
    <div class="history-summary-bar">
      <div>
        <div style="font-size:16px;color:var(--gray-muted)">${monthLabel(ym)}の記帳件数</div>
        <div style="font-family:'Shippori Mincho',serif;font-size:20px;font-weight:700">${txs.length}件 <span style="font-size:16px;color:var(--ink-soft);font-weight:400">/ ${fmtYen(total)}</span></div>
      </div>
    </div>

    <div class="sort-tabs">
      ${Object.keys(HISTORY_MAIN_LABELS).map(m => `<button class="sort-tab ${_historyMainTab===m?'active':''}" onclick="setHistoryMainTab('${m}')">${HISTORY_MAIN_LABELS[m]}</button>`).join('')}
    </div>
    <div class="sub-toggle-row">
      <label class="sub-toggle">
        <input type="checkbox" ${filterIsOn?'checked':''} onchange="toggleHistoryFilter(this.checked)">
        <span>${HISTORY_FILTER_LABELS[_historyMainTab]}</span>
      </label>
    </div>

    ${filterTriggerHtml}
    ${categoryHint}
  `;

  const needsSelection = filterIsOn && (
    (_historyMainTab === 'date' && !_historyFilterDay) ||
    (_historyMainTab === 'category' && !_historyFilterCategory) ||
    (_historyMainTab === 'method' && !_historyFilterMethod) ||
    (_historyMainTab === 'genre' && !_historyFilterGenre) ||
    (_historyMainTab === 'amount' && _historyFilterAmountMin === null && _historyFilterAmountMax === null)
  );

  if (needsSelection) {
    html += `<div class="card category-list"><div class="empty-hint">${_historyMainTab === 'amount' ? '上の欄に金額を入力して検索してください' : '上のボタンから選択してください'}</div></div>`;
  } else if (sorted.length === 0) {
    html += '<div class="card category-list"><div class="empty-hint">該当する記帳がありません</div></div>';
  } else if (_historyMainTab === 'date' || _historyMainTab === 'amount' || filterIsOn) {
    html += '<div class="card category-list">' + sorted.map(t => historyRowHtml(t)).join('') + '</div>';
  } else {
    const groupKeyFn =
      _historyMainTab === 'category' ? (t => t.category) :
      _historyMainTab === 'method'   ? (t => t.method) :
      _historyMainTab === 'genre'    ? (t => genreLabel(txGenre(t))) :
      (t => t.category);
    const groups = [];
    let lastKey = null;
    sorted.forEach(t => {
      const key = groupKeyFn(t);
      if (key !== lastKey) {
        groups.push({key, rawGenre: _historyMainTab === 'genre' ? txGenre(t) : null, items: []});
        lastKey = key;
      }
      groups[groups.length-1].items.push(t);
    });
    html += groups.map(g => {
      const subtotal = g.items.reduce((a,t)=>a+t.amount,0);
      const labelColor = g.rawGenre ? GENRE_CARD_META[g.rawGenre].color : 'var(--terracotta)';
      return `
        <div class="history-group-label" style="color:${labelColor}">
          <span>${escapeHtml(g.key)}</span>
          <span style="color:var(--gray-muted);font-weight:400">${fmtYen(subtotal)} ・ ${g.items.length}件</span>
        </div>
        <div class="card category-list" style="margin-bottom:10px">${g.items.map(t => historyRowHtml(t)).join('')}</div>
      `;
    }).join('');
  }

  document.getElementById('history-content').innerHTML = html;
  injectHistoryStyles();

  if (_historyMainTab === 'amount' && filterIsOn) {
    const input = document.getElementById('amount-filter-input');
    if (input) {
      input.onkeydown = (e) => { if (e.key === 'Enter') applyAmountFilter(); };
    }
  }
}

function applyAmountFilter(){
  const input = document.getElementById('amount-filter-input');
  const raw = input ? input.value.trim() : '';
  _historyFilterAmountRaw = raw;
  if (!raw) {
    _historyFilterAmountMin = null;
    _historyFilterAmountMax = null;
    renderHistory();
    return;
  }
  const parts = raw.split(/[-~〜]/).map(s => s.trim()).filter(Boolean);
  if (parts.length >= 2) {
    const a = parseFloat(parts[0].replace(/[^\d.]/g,''));
    const b = parseFloat(parts[1].replace(/[^\d.]/g,''));
    if (isNaN(a) || isNaN(b)) { showToast('金額の形式が正しくありません（例：1000-3000）'); return; }
    _historyFilterAmountMin = Math.min(a,b);
    _historyFilterAmountMax = Math.max(a,b);
  } else {
    const v = parseFloat(parts[0].replace(/[^\d.]/g,''));
    if (isNaN(v)) { showToast('金額の形式が正しくありません（例：5000）'); return; }
    _historyFilterAmountMin = v;
    _historyFilterAmountMax = v;
  }
  renderHistory();
}

function historyRowHtml(t){
  const isIncomeHistoryEntry = typeof t.id === 'string' && t.id.startsWith('inc_');
  const tapAction = isIncomeHistoryEntry
    ? `showToast('収入は設定 › 収入から編集できます'); goToIncomeSettings();`
    : `openTxModal('${t.id}')`;
  const genre = txGenre(t);
  const meta = GENRE_CARD_META[genre];
  const genreTag = `<span class="hist-genre-tag" style="color:${meta.color};background:${meta.accent}">${escapeHtml(genreLabel(genre))}</span>`;
  const genreDot = `<span class="hist-genre-dot" style="background:${meta.color}"></span>`;
  return `
    <div class="cat-item" style="cursor:pointer" onclick="${tapAction}">
      <div class="cat-item-top">
        <span class="cat-name">${genreDot}${catNameHtml(t.category)}</span>
        <span class="cat-amount">${fmtYen(t.amount)}</span>
      </div>
      ${catDetailHtml(t.category)}
      <div style="font-size:16px;color:var(--gray-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span>${t.date.split('-').slice(1).join('/')} ・ ${escapeHtml(t.method)}${t.memo?' ・ '+escapeHtml(t.memo):''}</span>
        ${_historyMainTab === 'genre' ? '' : genreTag}
      </div>
    </div>`;
}

function setHistoryMainTab(tab){
  _historyMainTab = tab;
  renderHistory();
  scrollToTop();
}

function toggleHistoryFilter(checked){
  _historyFilterOn[_historyMainTab] = checked;
  if (_historyMainTab === 'amount' && !checked) {
    _historyFilterAmountMin = null;
    _historyFilterAmountMax = null;
    _historyFilterAmountRaw = '';
  }
  renderHistory();
}

/* ============================================================
   ドラム式ピッカー（履歴の絞り込み用 / golf_trackerと同じ操作感）
   ============================================================ */
let _drumScrollEl = null;
let _drumValues = [];
let _drumTargetField = null; // 'category' | 'method'

function openHistoryFilterDrum(field){
  _drumTargetField = field;
  const ym = AppState.currentMonth;
  const txsInMonth = getHistoryDisplayTxs(ym);

  let values, title, currentVal, formatter = null;
  if (field === 'day') {
    const usedDays = [...new Set(txsInMonth.map(t => parseInt(t.date.split('-')[2],10)))].sort((a,b)=>a-b);
    values = usedDays.map(d => String(d));
    title = '日付で絞り込み';
    currentVal = _historyFilterDay ? String(_historyFilterDay) : (values[0]||null);
    formatter = v => v + '日';
  } else if (field === 'genre') {
    values = GENRES; // 収入・支出・先取り貯金・返済・投資保険、全ジャンルを常に表示
    title = 'ジャンルで絞り込み';
    currentVal = _historyFilterGenre || (values[0]||null);
    formatter = genreLabel;
  } else if (field === 'category') {
    const usedCats = [...new Set(txsInMonth.map(t => t.category))];
    const candidateNames = _historyFilterGenre
      ? categoryOptionsForGenre(_historyFilterGenre)
      : AppState.categories.map(c=>c.name).concat(AppState.incomeSources.map(s=>s.name));
    values = candidateNames.filter(n => usedCats.includes(n));
    title = _historyFilterGenre ? `${genreLabel(_historyFilterGenre)}の項目で絞り込み` : '項目で絞り込み';
    currentVal = _historyFilterCategory || (values[0]||null);
  } else {
    const usedMethods = [...new Set(txsInMonth.map(t => t.method))];
    values = AppState.paymentMethods.map(m=>m.name).concat(['収入']).filter((n,i,arr) => usedMethods.includes(n) && arr.indexOf(n)===i);
    title = '支払い方法で絞り込み';
    currentVal = _historyFilterMethod || (values[0]||null);
  }

  if (values.length === 0) {
    showToast('この月にはデータがありません');
    return;
  }

  buildDrumDOM(title, values, currentVal, formatter);
}

function buildDrumDOM(title, values, currentVal, formatter){
  let existing = document.getElementById('drum-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'drum-overlay show';
  overlay.id = 'drum-overlay';
  overlay.onclick = e => { if (e.target === overlay) closeDrum(false); };

  const sheet = document.createElement('div');
  sheet.className = 'drum-sheet';
  sheet.innerHTML = `
    <div class="drum-toolbar">
      <button class="drum-cancel" onclick="closeDrum(false)">キャンセル</button>
      <span class="drum-title">${escapeHtml(title)}</span>
      <button class="drum-done" onclick="closeDrum(true)">決定</button>
    </div>
    <div class="drum-body" id="drum-body"></div>`;
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);

  const body = document.getElementById('drum-body');
  const col = document.createElement('div');
  col.className = 'drum-col';
  col.style.position = 'relative';

  const lbl = document.createElement('div');
  lbl.className = 'drum-col-label';
  lbl.textContent = '選択してください';

  const scroll = document.createElement('div');
  scroll.className = 'drum-scroll';

  const ITEM_H = 44;
  const PAD = 2;
  for (let p=0; p<PAD; p++) {
    const pad = document.createElement('div');
    pad.className = 'drum-item';
    scroll.appendChild(pad);
  }
  values.forEach(v => {
    const item = document.createElement('div');
    item.className = 'drum-item';
    item.textContent = formatter ? formatter(v) : v;
    scroll.appendChild(item);
  });
  for (let p=0; p<PAD; p++) {
    const pad = document.createElement('div');
    pad.className = 'drum-item';
    scroll.appendChild(pad);
  }

  const highlight = document.createElement('div');
  highlight.className = 'drum-highlight';

  col.appendChild(lbl);
  col.appendChild(scroll);
  col.appendChild(highlight);
  body.appendChild(col);

  const curIdx = values.indexOf(currentVal);
  const targetIdx = curIdx >= 0 ? curIdx : 0;
  requestAnimationFrame(() => {
    scroll.scrollTop = targetIdx * ITEM_H;
    updateDrumHighlight(scroll);
  });

  scroll.addEventListener('scroll', () => updateDrumHighlight(scroll), {passive:true});

  _drumScrollEl = scroll;
  _drumValues = values;
}

function updateDrumHighlight(scroll){
  const ITEM_H = 44;
  const PAD = 2;
  const rawIdx = scroll.scrollTop / ITEM_H;
  const snapIdx = Math.round(rawIdx);
  const items = scroll.querySelectorAll('.drum-item');
  items.forEach((el,i) => {
    el.classList.toggle('selected', i === snapIdx + PAD);
  });
}

function getDrumValue(){
  const ITEM_H = 44;
  const idx = Math.max(0, Math.min(_drumValues.length-1, Math.round(_drumScrollEl.scrollTop / ITEM_H)));
  return _drumValues[idx];
}

function closeDrum(apply){
  if (apply && _drumScrollEl) {
    const val = getDrumValue();
    if (_drumTargetField === 'category') _historyFilterCategory = val;
    if (_drumTargetField === 'method') _historyFilterMethod = val;
    if (_drumTargetField === 'day') _historyFilterDay = val;
    if (_drumTargetField === 'genre') _historyFilterGenre = val;
    if (_drumTargetField === 'tx-genre') {
      _selectedTxGenre = val;
      _txIsIncome = val === '収入';
      // ジャンルが変わったら項目をそのジャンルの先頭候補にリセット
      const opts = categoryOptionsForGenre(_selectedTxGenre);
      _selectedTxCategory = opts[0] || null;
      updateTxFieldTriggerLabels();
    }
    if (_drumTargetField === 'tx-category') { _selectedTxCategory = val; updateTxFieldTriggerLabels(); }
    if (_drumTargetField === 'tx-method') { _selectedTxMethod = val; updateTxFieldTriggerLabels(); }
    if (_drumTargetField === 'analysis-category') { _analysisSelectedCategory = val; renderAnalysis(); }

      }
    }
    if (_drumTargetField && _drumTargetField.startsWith('billing-day-')) {
      const idx = parseInt(_drumTargetField.replace('billing-day-',''), 10);
      if (AppState.paymentMethods[idx]) {
        AppState.paymentMethods[idx].billingDay = parseInt(val, 10);
        saveLocalState();

      }
    }
    if (_drumTargetField && _drumTargetField.startsWith('billing-offset-')) {
      const idx = parseInt(_drumTargetField.replace('billing-offset-',''), 10);
      if (AppState.paymentMethods[idx]) {
        AppState.paymentMethods[idx].billingOffset = parseInt(val, 10);
        saveLocalState();
        renderSettingsTabContent();
      }
    }
    if (_drumTargetField && _drumTargetField.startsWith('income-day|')) {
      const [, ym, name] = _drumTargetField.split('|');
      const stored = stor('kk_income_actual') || {};
      if (!stored[ym]) stored[ym] = {};
      const existing = stored[ym][name] || {};
      const prev = typeof existing === 'object' ? existing : {amount: existing, day: null};
      stored[ym][name] = {...prev, day: parseInt(val, 10)};
      stor('kk_income_actual', stored);
      if (currentUser) saveToFirestore();
      renderSettingsTabContent();
    }
    if (_drumTargetField === 'category' || _drumTargetField === 'method' || _drumTargetField === 'day' || _drumTargetField === 'genre') renderHistory();
  }
  const overlay = document.getElementById('drum-overlay');
  if (overlay) overlay.remove();
  _drumScrollEl = null;
  _drumValues = [];
  _drumTargetField = null;
}
function getPastMonths(ym, count){
  const months = [];
  const [y,m] = ym.split('-').map(Number);
  for (let i = count-1; i >= 0; i--) {
    const d = new Date(y, m-1-i, 1);
    months.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}`);
  }
  return months;
}

function getMonthlyBudgets(ym){
  const stored = stor('kk_monthly_budgets') || {};

  // その月に個別設定があればそれを使う
  if (stored[ym]) return stored[ym];

  // 個別設定が無い月は、常に設定（項目・予算）のデフォルト値を使う。
  // 他の月で保存した値をここに引き継ぐことは絶対にしない
  // （例：4月だけ予算を変更して保存しても、5月以降はデフォルトのまま）
  const defaults = {};
  AppState.categories.forEach(c => { defaults[c.name] = c.budget || 0; });
  return defaults;
}

function setMonthlyBudgets(ym, budgets){
  const stored = stor('kk_monthly_budgets') || {};
  stored[ym] = budgets;
  stor('kk_monthly_budgets', stored);
  if (currentUser) saveToFirestore();
}

function getEnvelopeResetYm(){
  return stor('kk_envelope_reset_ym') || null;
}

function setEnvelopeResetYm(ym){
  stor('kk_envelope_reset_ym', ym);
  if (currentUser) saveToFirestore();
}

function getEnvelopeBalance(ym, catName){
  const resetYm = getEnvelopeResetYm();

  const monthlyBudgets = getMonthlyBudgets(ym);
  const budget = monthlyBudgets[catName] !== undefined
    ? monthlyBudgets[catName]
    : (AppState.categories.find(c=>c.name===catName)||{}).budget || 0;
  const actual = getCategoryActualForMonth(ym, catName);

  // ① 基準年月が設定されている場合
  if (resetYm) {
    // 基準年月以前（基準月を含む）は繰越なし
    if (ym <= resetYm) return budget - actual;
    // 基準年月の翌月以降：前月を繰越す
    const [y,m] = ym.split('-').map(Number);
    const prev = new Date(y, m-2, 1);
    const prevYm = `${prev.getFullYear()}-${pad2(prev.getMonth()+1)}`;
    const prevBalance = getEnvelopeBalance(prevYm, catName);
    return prevBalance + budget - actual;
  }

  // ② 基準年月が未設定の場合：最古トランザクション月から計算
  const tx = AppState.transactions;
  const oldestYm = tx.length > 0
    ? tx.reduce((a,b) => a.date < b.date ? a : b).date.slice(0,7)
    : ym;

  // 最古月以前はゼロスタート
  if (ym <= oldestYm) return budget - actual;

  const [y,m] = ym.split('-').map(Number);
  const prev = new Date(y, m-2, 1);
  const prevYm = `${prev.getFullYear()}-${pad2(prev.getMonth()+1)}`;
  const prevBalance = getEnvelopeBalance(prevYm, catName);
  return prevBalance + budget - actual;
}

function getEnvelopesForMonth(ym){
  return AppState.categories.map(cat => {
    const monthlyBudgets = getMonthlyBudgets(ym);
    const budget = monthlyBudgets[cat.name] !== undefined ? monthlyBudgets[cat.name] : cat.budget || 0;
    const actual = getCategoryActualForMonth(ym, cat.name);
    const balance = getEnvelopeBalance(ym, cat.name);
    const diff = budget - actual; // 今月の差額（予算 − 実績）
    return { name: cat.name, group: cat.group, budget, actual, balance, diff };
  }).filter(e => e.budget > 0 || e.actual > 0);
}

/* ── 封筒リセット（年月2列ドラム） ── */
let _envelopeResetScrolls = [];

function openEnvelopeResetDrum(){
  const now = new Date();
  const curY = now.getFullYear();
  const curM = now.getMonth()+1;
  const years  = Array.from({length:5}, (_,i) => String(curY - 2 + i));
  const months = Array.from({length:12}, (_,i) => String(i+1));
  const resetYm = getEnvelopeResetYm();
  const [ry, rm] = resetYm ? resetYm.split('-') : [String(curY), String(curM)];

  let existing = document.getElementById('drum3-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.className = 'drum-overlay show';
  overlay.id = 'drum3-overlay';
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

  const ITEM_H = 44, PAD = 2;
  const cols = [
    {label:'年', values: years,  cur: ry,  fmt: v => v+'年'},
    {label:'月', values: months, cur: rm.replace(/^0/,''), fmt: v => v+'月'},
  ];

  overlay.innerHTML = `
    <div class="drum-sheet">
      <div class="drum-toolbar">
        <button class="drum-cancel" onclick="document.getElementById('drum3-overlay').remove();_envelopeResetScrolls=[]">キャンセル</button>
        <span class="drum-title">封筒の基準年月を設定</span>
        <button class="drum-done" onclick="closeEnvelopeResetDrum()">決定</button>
      </div>
      <div style="font-size:13px;color:var(--terracotta);text-align:center;padding:8px 16px 0">この月以前の繰越を無視してリセットします</div>
      <div class="drum-body" id="drum3-body"></div>
    </div>`;
  document.body.appendChild(overlay);

  _envelopeResetScrolls = [];
  const body = document.getElementById('drum3-body');
  cols.forEach(col => {
    const colEl = document.createElement('div');
    colEl.className = 'drum-col'; colEl.style.position = 'relative';
    const lbl = document.createElement('div');
    lbl.className = 'drum-col-label'; lbl.textContent = col.label;
    const scroll = document.createElement('div');
    scroll.className = 'drum-scroll';
    for (let p=0;p<PAD;p++){const pad=document.createElement('div');pad.className='drum-item';scroll.appendChild(pad);}
    col.values.forEach(v=>{const item=document.createElement('div');item.className='drum-item';item.textContent=col.fmt(v);scroll.appendChild(item);});
    for (let p=0;p<PAD;p++){const pad=document.createElement('div');pad.className='drum-item';scroll.appendChild(pad);}
    const hl = document.createElement('div'); hl.className = 'drum-highlight';
    colEl.appendChild(lbl); colEl.appendChild(scroll); colEl.appendChild(hl);
    body.appendChild(colEl);
    const curIdx = Math.max(0, col.values.indexOf(col.cur));
    requestAnimationFrame(()=>{ scroll.scrollTop = curIdx * ITEM_H; updateDrumHighlight(scroll); });
    scroll.addEventListener('scroll', ()=>updateDrumHighlight(scroll), {passive:true});
    _envelopeResetScrolls.push({scroll, values: col.values});
  });
}

function closeEnvelopeResetDrum(){
  const ITEM_H = 44;
  const [yScroll, mScroll] = _envelopeResetScrolls;
  const yIdx = Math.max(0, Math.min(yScroll.values.length-1, Math.round(yScroll.scroll.scrollTop/ITEM_H)));
  const mIdx = Math.max(0, Math.min(mScroll.values.length-1, Math.round(mScroll.scroll.scrollTop/ITEM_H)));
  const y = yScroll.values[yIdx];
  const m = mScroll.values[mIdx];
  const newResetYm = `${y}-${pad2(m)}`;

  const overlay = document.getElementById('drum3-overlay');
  if (overlay) overlay.remove();
  _envelopeResetScrolls = [];

  showConfirm(`${y}年${m}月を封筒の基準年月にします。\nこれ以前の繰越残高は無視されます。よろしいですか？`, () => {
    setEnvelopeResetYm(newResetYm);
    showToast(`封筒の基準年月を${y}年${m}月に設定しました`);
    renderEnvelopePage();
  }, '設定する');
}

function deleteCategoryFromEnvelope(catName){
  showConfirm(
    `「${catName}」を削除しますか？\n\n設定の項目からも削除されます。過去の記帳データは残りますが、封筒・分析への集計には影響します。`,

function openEnvelopeHistoryModal(catName){
  const currentYm = AppState.currentMonth;
  const resetYm = getEnvelopeResetYm();

  // 基準年月から現在月まで（基準年月未設定なら直近12ヶ月）
  let months;
  if (resetYm) {
    // resetYmから現在月まで全月を列挙
    months = [];
    let [ry, rm] = resetYm.split('-').map(Number);
    const [cy, cm] = currentYm.split('-').map(Number);
    while (ry < cy || (ry === cy && rm <= cm)) {
      months.push(`${ry}-${pad2(rm)}`);
      rm++;
      if (rm > 12) { rm = 1; ry++; }
    }
    months.reverse(); // 新しい月を先頭に
  } else {
    months = getPastMonths(currentYm, 12);
  }

  const rows = months.map(ym => {
    const monthlyBudgets = getMonthlyBudgets(ym);
    const budget = monthlyBudgets[catName] !== undefined ? monthlyBudgets[catName] : (AppState.categories.find(c=>c.name===catName)||{}).budget || 0;
    const actual = getCategoryActualForMonth(ym, catName);
    const balance = getEnvelopeBalance(ym, catName);
    const diff = budget - actual;
    return { ym, budget, actual, balance, diff };
  });

  const bodyContent = `
    <div style="margin-bottom:16px">
      ${rows.length === 0 ? '<div class="empty-hint">データがありません</div>' : rows.map(r => `
        <div style="border-bottom:1px solid var(--cream-deep);padding:12px 0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:15px;font-weight:700">${monthLabel(r.ym)}</span>
            <span style="font-size:15px;font-weight:700;color:${r.balance<0?'var(--red-deficit)':'var(--sage-deep)'}">封筒 ${fmtYenSigned(r.balance).replace('+','')}</span>
          </div>
          <div style="display:flex;gap:12px;font-size:13px;color:var(--gray-muted);margin-bottom:8px">
            <span>予算 <b style="color:var(--ink)">${fmtYen(r.budget)}</b></span>
            <span>実績 <b style="color:var(--ink)">${fmtYen(r.actual)}</b></span>
            <span>差額 <b style="color:${r.diff>=0?'var(--sage-deep)':'var(--red-deficit)'}">${fmtYenSigned(r.diff)}</b></span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:13px;color:var(--gray-muted);flex-shrink:0">予算:</span>
            <input type="number" id="env-budget-${escapeHtml(r.ym)}" value="${r.budget}" style="flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--cream)"
              onchange="updateMonthlyBudget('${escapeJs(r.ym)}','${escapeJs(catName)}',this.value)">
            <button onclick="saveMonthlyBudgets('${escapeJs(r.ym)}')" style="padding:7px 12px;border-radius:8px;border:none;background:var(--terracotta);color:white;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer">保存</button>
          </div>
        </div>`).join('')}
    </div>`;

  document.getElementById('history-modal-title').textContent = `${catName}の月別履歴`;
  document.getElementById('history-modal-body').innerHTML = bodyContent;
  document.getElementById('history-modal-overlay').classList.add('show');
}

function updateMonthlyBudget(ym, catName, value){
  const stored = stor('kk_monthly_budgets') || {};
  if (!stored[ym]) stored[ym] = {...getMonthlyBudgets(ym)};
  stored[ym][catName] = parseFloat(value) || 0;
  stor('kk_monthly_budgets', stored);
}

function saveMonthlyBudgets(ym){
  const stored = stor('kk_monthly_budgets') || {};
  if (!stored[ym]) stored[ym] = {...getMonthlyBudgets(ym)};
  stor('kk_monthly_budgets', stored);
  if (currentUser) saveToFirestore();
  showToast(`${monthLabel(ym)}の予算を確定しました`);
  // 封筒ページにいれば再描画（モーダル内から呼ばれた場合もページ側を更新）
  const activePage = document.querySelector('.page.active')?.id?.replace('page-','');
  if (activePage === 'envelope') renderEnvelopePage();
  else if (activePage === 'analysis') renderAnalysis();
}

function fmtYenShort(n){
  const r = Math.round(n);
  const sign = r < 0 ? '-' : '';
  const abs = Math.abs(r);
  if (abs >= 10000) return sign + (abs/10000).toFixed(abs%10000===0?0:1) + '万';
  return sign + abs.toLocaleString();
}
